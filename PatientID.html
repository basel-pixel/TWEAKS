<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>طباعة استيكر المريض</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* المعاينة على الشاشة ستظل بالعرض لسهولة القراءة */
            --label-width: 50mm;
            --label-height: 30mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #0f172a;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .hospital-logo img {
            max-width: 120px;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .suggestions-box {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            z-index: 1000;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-height: 200px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .suggestions-box.open {
            display: block;
        }

        .suggestion-item {
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggestion-item:hover {
            background-color: #eff6ff;
        }

        .suggestion-item.active {
            background-color: #dbeafe;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }

        #loading-msg {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #2563eb;
            min-height: 20px;
            flex: 1;
        }

        .btn-refresh {
            flex-shrink: 0;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-refresh:hover {
            background: #dbeafe;
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .copies-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .copies-box label {
            font-weight: bold;
            color: #0f172a;
            font-size: 15px;
        }

        .copies-box input {
            width: 70px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        .copies-box input:focus {
            border-color: #10b981;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-print {
            background: #10b981;
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .btn-print:active {
            transform: scale(0.97);
        }

        /* المعاينة */
        .exact-preview-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .exact-preview-canvas {
            display: block;
            width: 50mm;
            height: 30mm;
            background: #ffffff;
            border: 1px dashed #000000;
            box-sizing: content-box;
        }

        .manual-edit-box {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 6px;
        }

        .manual-edit-box input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .manual-edit-box input:focus {
            border-color: #10b981;
        }

        #print-container {
            display: none;
        }

        .thermal-print-image {
            display: block;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: #ffffff;
            image-rendering: auto;
        }

        /* =========================================================
           إعدادات الطباعة: الورقة ستكون بالطول (30mm عرض × 50mm طول)
        ========================================================= */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 30mm !important;
                height: 50mm !important;
                background: #ffffff !important;
                color: #000000 !important;
            }

            body { display: block !important; }
            .no-print, .app-container { display: none !important; }

            #print-container {
                display: block !important;
                width: 30mm !important;
                height: 50mm !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            @page {
                size: 30mm 50mm; /* الورقة بالطول Portrait */
                margin: 0;
            }

            .thermal-print-image {
                display: block !important;
                width: 30mm !important;
                height: 50mm !important;
                margin: 0 !important;
                padding: 0 !important;
                page-break-after: always;
                break-after: page;
                background: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .thermal-print-image:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>

<body>

    <div class="app-container no-print">
        <div class="hospital-logo">
            <img src="MEpics/Picture1.png" alt="مستشفى صيدناوي" onerror="this.onerror=null; this.src='TWEAKS/MEpics/Picture1.png';">
        </div>

        <h2>طباعة استيكر المريض</h2>

        <div class="status-row">
            <div id="loading-msg">جاري تحميل البيانات من الشيت... ⏳</div>
            <button type="button" id="refresh-btn" class="btn-refresh" onclick="loadData()" title="تحديث البيانات من الشيت">🔄 تحديث</button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="اكتب اسم المريض للبحث..." autocomplete="off">
            <div id="suggestions" class="suggestions-box"></div>
        </div>

        <div class="copies-box">
            <label for="copies-count">عدد النسخ (الستيكرات):</label>
            <input type="number" id="copies-count" min="1" max="50" value="1">
        </div>

        <div class="preview-section">
            <div class="preview-title">معاينة الاستيكر (يمكن تعديل النص يدوياً قبل الطباعة)</div>
            
            <div class="exact-preview-wrap">
                <!-- المعاينة بالعرض لسهولة القراءة (بدون لوجو) -->
                <canvas
                    id="preview-canvas"
                    class="exact-preview-canvas"
                    width="400"
                    height="240"
                    aria-label="معاينة الاستيكر"
                ></canvas>

                <div class="manual-edit-box">
                    <input
                        type="text"
                        id="st-name"
                        value="اسم المريض"
                        aria-label="اسم المريض"
                    >

                    <input
                        type="text"
                        id="st-unified-id"
                        value="---"
                        aria-label="الرقم الموحد"
                    >
                </div>
            </div>
        </div>

        <button class="btn-print" onclick="printStickers()">🖨️ طباعة الاستيكرات</button>
    </div>

    <div id="print-container"></div>

<script>
    /* 
       المقاس المنطقي (الرسم الداخلي): دائمًا 400 عرض × 240 طول
       حتى يتم رسم الكلام بشكل عرضي (Landscape).
    */
    const LOGICAL_WIDTH = 400;
    const LOGICAL_HEIGHT = 240;

    /* 
       مقاس الطباعة الفعلي (Portrait): 240 عرض × 400 طول
       وسيتم لف الـ Canvas بداخله.
    */
    const PRINT_CANVAS_WIDTH = 240;
    const PRINT_CANVAS_HEIGHT = 400;

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeEUxAcEspHRKlu7XJ6WIyN7__IMKqzSo1iMryvgH1T3upSkuXpkOTb9sSeDQhhuokPe4ZFem3P1mW/pub?gid=95330193&single=true&output=csv";

    let patientsList = [];
    const searchInput = document.getElementById('search-input');
    const suggestionsBox = document.getElementById('suggestions');
    const loadingMsg = document.getElementById('loading-msg');
    const refreshBtn = document.getElementById('refresh-btn');
    const copiesCount = document.getElementById('copies-count');
    const stName = document.getElementById('st-name');
    const stUnifiedId = document.getElementById('st-unified-id');
    const previewCanvas = document.getElementById('preview-canvas');

    function normalizeArabic(text) {
        return String(text || '').trim().toLowerCase()
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ة/g, 'ه')
            .replace(/[ؤئ]/g, 'ء')
            .replace(/\s+/g, ' ');
    }

    function parseCSVLine(text) {
        let result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"') {
                if (inQuotes && text[i + 1] === '"') {
                    current += '"'; i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim()); current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim());
        return result;
    }

    let dataStatus = 'loading';

    /* =========================================================
       تحميل البيانات (باستخدام الرابط الصافي والمباشر)
    ========================================================= */
    async function loadData() {
        dataStatus = 'loading';
        refreshBtn.disabled = true;
        loadingMsg.style.display = 'block';
        loadingMsg.innerText = 'جاري تحميل البيانات من الشيت... ⏳';
        loadingMsg.style.color = '#2563eb';

        try {
            const response = await fetch(CSV_URL);

            if (!response.ok) {
                throw new Error("Error fetching CSV");
            }

            const csvText = await response.text();

            const lines = csvText
                .split(/\r\n|\n/)
                .filter(l => l.trim() !== '');

            if (lines.length < 2) {
                loadingMsg.innerText = '⚠️ لا توجد بيانات في الشيت';
                loadingMsg.style.color = '#dc2626';
                dataStatus = 'error';
                refreshBtn.disabled = false;
                return;
            }

            const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
            const colName = headers.findIndex(h => h.includes('اسم') || h.includes('المريض'));
            const colUnified = headers.findIndex(h => h.includes('موحد') || h.includes('طبي'));

            const tempPatients = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]).map(c => c.replace(/^"|"$/g, '').trim());
                if (colName !== -1 && cols[colName]) {
                    tempPatients.push({
                        name: cols[colName] || '',
                        unifiedId: colUnified !== -1 ? cols[colUnified] : ''
                    });
                }
            }

            patientsList = tempPatients;
            dataStatus = 'ready';

            // تصفير البحث
            currentMatches = [];
            activeIndex = -1;
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.remove('open');

            // تحديث الاستيكر لو كنت مختار مريض بالفعل
            if (selectedPatient) {
                const updatedPatient = patientsList.find(
                    p => normalizeArabic(p.name) === normalizeArabic(selectedPatient.name)
                );
                if (updatedPatient) {
                    selectedPatient = updatedPatient;
                    stName.value = updatedPatient.name || '---';
                    stUnifiedId.value = updatedPatient.unifiedId || '---';
                    updatePreview();
                }
            }

            loadingMsg.innerText = `✅ تم سحب ${patientsList.length} مريض جاهزين للطباعة`;
            loadingMsg.style.color = '#10b981';
            refreshBtn.disabled = false;

            setTimeout(() => {
                loadingMsg.style.display = 'none';
            }, 3000);

        } catch (error) {
            console.error(error);
            loadingMsg.innerText = '⚠️ حدث خطأ في الاتصال بالشيت (يرجى مراجعة الرابط)';
            loadingMsg.style.color = '#dc2626';
            dataStatus = 'error';
            refreshBtn.disabled = false;
        }
    }

    function renderActiveHighlight() {
        const items = suggestionsBox.querySelectorAll('.suggestion-item[data-idx]');
        items.forEach(el => el.classList.remove('active'));
        if (activeIndex >= 0 && items[activeIndex]) {
            items[activeIndex].classList.add('active');
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    searchInput.addEventListener('input', (e) => {
        const query = normalizeArabic(e.target.value);
        suggestionsBox.innerHTML = '';
        activeIndex = -1;
        selectedPatient = null;

        if (!query) {
            suggestionsBox.classList.remove('open');
            currentMatches = [];
            return;
        }

        currentMatches = patientsList
            .filter(p => normalizeArabic(p.name).includes(query))
            .slice(0, 10);

        if (currentMatches.length === 0) {
            suggestionsBox.innerHTML = '<div class="suggestion-item" style="color:#94a3b8;">لا يوجد نتائج...</div>';
        } else {
            currentMatches.forEach((patient, idx) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.dataset.idx = idx;
                div.innerText = patient.name;
                div.onmousedown = (ev) => {
                    ev.preventDefault();
                    activeIndex = idx;
                    fillSticker(patient);
                };
                suggestionsBox.appendChild(div);
            });
        }
        suggestionsBox.classList.add('open');
    });

    searchInput.addEventListener('keydown', (e) => {
        if (!suggestionsBox.classList.contains('open') || currentMatches.length === 0) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = (activeIndex + 1) % currentMatches.length;
            renderActiveHighlight();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = (activeIndex - 1 + currentMatches.length) % currentMatches.length;
            renderActiveHighlight();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && currentMatches[activeIndex]) {
                fillSticker(currentMatches[activeIndex]);
            }
        } else if (e.key === 'Escape') {
            suggestionsBox.classList.remove('open');
        }
    });

    searchInput.addEventListener('blur', () =>
        setTimeout(() => suggestionsBox.classList.remove('open'), 150)
    );

    function fillSticker(patient) {
        selectedPatient = patient;
        searchInput.value = patient.name;
        suggestionsBox.classList.remove('open');
        stName.value = patient.name || "---";
        stUnifiedId.value = patient.unifiedId || "---";
        updatePreview();
    }

    function loadLogoImage() {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                const fallback = new Image();
                fallback.onload = () => resolve(fallback);
                fallback.onerror = reject;
                fallback.src = 'TWEAKS/MEpics/sidnawi_thermal_logo.png';
            };
            img.src = 'MEpics/sidnawi_thermal_logo.png';
        });
    }

    function drawTextRTL(ctx, text, x, y, font, maxWidth) {
        ctx.save();
        ctx.direction = 'rtl';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = font;
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 0.35;
        ctx.strokeText(text, x, y, maxWidth);
        ctx.fillText(text, x, y, maxWidth);
        ctx.restore();
    }

    /* 
       دالة الرسم:
       - isPrint = false (للمعاينة): ترسم بالعرض 400x240 (بدون لوجو)
       - isPrint = true (للطباعة): ترسم بالطول 240x400 وتلف الرسمة 90 درجة (مع اللوجو)
    */
    async function createThermalSticker(targetCanvas = null, isPrint = false) {
        const canvas = targetCanvas || document.createElement('canvas');
        
        if (isPrint) {
            canvas.width = PRINT_CANVAS_WIDTH;   // 240
            canvas.height = PRINT_CANVAS_HEIGHT; // 400
        } else {
            canvas.width = LOGICAL_WIDTH;        // 400
            canvas.height = LOGICAL_HEIGHT;      // 240
        }

        const ctx = canvas.getContext('2d', { alpha: false });

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();

        if (isPrint) {
            // لف الـ Canvas 90 درجة في اتجاه عقارب الساعة لتناسب الورقة الـ Portrait
            ctx.translate(PRINT_CANVAS_WIDTH, 0);
            ctx.rotate(90 * Math.PI / 180);
        }

        // --- جميع الإحداثيات هنا تعتمد على العرض 400 والطول 240 ---

        const name = stName.value.trim() || '---';
        const unified = stUnifiedId.value.trim() || '---';

        // طباعة اللوجو فقط عند الطباعة الفعلية (isPrint = true) ومخفي في المعاينة
        if (isPrint) {
            try {
                const logo = await loadLogoImage();
                const maxLogoWidth = 90;
                const maxLogoHeight = 32;

                const ratio = Math.min(
                    maxLogoWidth / logo.naturalWidth,
                    maxLogoHeight / logo.naturalHeight
                );

                const logoWidth = logo.naturalWidth * ratio;
                const logoHeight = logo.naturalHeight * ratio;

                const logoX = 20; 
                const logoY = LOGICAL_HEIGHT - logoHeight - 15; 

                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(logo, logoX, logoY, logoWidth, logoHeight);
            } catch (error) {
                console.warn('Logo could not be loaded', error);
            }
        }

        let nameText = name;
        let nameFontSize = 45;

        if (nameText.length > 18) nameFontSize = 38;
        if (nameText.length > 28) nameFontSize = 32;
        if (nameText.length > 38) nameFontSize = 26;

        drawTextRTL(
            ctx,
            nameText,
            LOGICAL_WIDTH / 2,
            58, 
            `900 ${nameFontSize}px Tahoma, Arial, sans-serif`,
            380
        );

        const unifiedText = `رقم موحد: ${unified}`;

        drawTextRTL(
            ctx,
            unifiedText,
            LOGICAL_WIDTH / 2,
            125, 
            `900 28px Tahoma, Arial, sans-serif`,
            380
        );

        ctx.restore();

        return canvas.toDataURL('image/png');
    }

    let previewUpdateTimer = null;
    let previewRenderNumber = 0;

    async function updatePreview() {
        const renderNumber = ++previewRenderNumber;
        try {
            // المعاينة ترسم بالشكل العرضي (isPrint = false)
            await createThermalSticker(previewCanvas, false);
            if (renderNumber !== previewRenderNumber) return;
        } catch (error) {
            console.error('Preview render error:', error);
        }
    }

    function schedulePreviewUpdate() {
        clearTimeout(previewUpdateTimer);
        previewUpdateTimer = setTimeout(updatePreview, 80);
    }

    stName.addEventListener('input', () => {
        selectedPatient = null;
        schedulePreviewUpdate();
    });

    stUnifiedId.addEventListener('input', () => {
        schedulePreviewUpdate();
    });

    async function printStickers() {
        const printContainer = document.getElementById('print-container');

        if (dataStatus === 'loading') {
            const proceed = confirm('⏳ البيانات لسه بتتحمل من الشيت. هل تحب تكمل الطباعة برضه؟');
            if (!proceed) return;
        }

        if (!selectedPatient && stName.value.trim() === 'اسم المريض') {
            const proceed = confirm('⚠️ لسه معملتش بحث عن مريض، والاستيكر لسه فاضي. هل تحب تكمل الطباعة؟');
            if (!proceed) return;
        }

        let copies = parseInt(copiesCount.value, 10);
        if (isNaN(copies) || copies < 1) copies = 1;
        if (copies > 50) copies = 50;

        const printButton = document.querySelector('.btn-print');
        const oldButtonText = printButton.innerText;
        printButton.disabled = true;
        printButton.innerText = '⏳ تجهيز الطباعة...';

        try {
            printContainer.innerHTML = '';
            // إنشاء صورة الطباعة بالطول وملفوفة 90 درجة مع اللوجو (isPrint = true)
            const imageData = await createThermalSticker(null, true);

            for (let i = 0; i < copies; i++) {
                const img = document.createElement('img');
                img.className = 'thermal-print-image';
                img.src = imageData;
                // مقاسات الصورة المطابقة لورقة الطابعة
                img.width = PRINT_CANVAS_WIDTH;
                img.height = PRINT_CANVAS_HEIGHT;
                printContainer.appendChild(img);
            }

            await new Promise(resolve =>
                requestAnimationFrame(() =>
                    requestAnimationFrame(resolve)
                )
            );

            window.print();
        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء تجهيز الاستيكر للطباعة.');
        } finally {
            printButton.disabled = false;
            printButton.innerText = oldButtonText;
        }
    }

    updatePreview();
    loadData();
</script>

</body>
</html>
