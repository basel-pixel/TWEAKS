<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>طباعة استيكر المريض</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #0f172a;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .hospital-logo img {
            max-width: 120px;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .suggestions-box {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            z-index: 1000;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-height: 200px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .suggestions-box.open {
            display: block;
        }

        .suggestion-item {
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggestion-item:hover {
            background-color: #eff6ff;
        }

        .suggestion-item.active {
            background-color: #dbeafe;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }

        #loading-msg {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #2563eb;
            min-height: 20px;
            flex: 1;
        }

        .btn-refresh {
            flex-shrink: 0;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-refresh:hover {
            background: #dbeafe;
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .copies-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .copies-box label {
            font-weight: bold;
            color: #0f172a;
            font-size: 15px;
        }

        .copies-box input {
            width: 70px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        .copies-box input:focus {
            border-color: #10b981;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-print {
            background: #10b981;
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .btn-print:active {
            transform: scale(0.97);
        }

        /* =========================================================
           الاستيكر الخاص بالمعاينة (على الشاشة بالعرض لسهولة القراءة)
        ========================================================= */
        .sticker {
            width: 50mm !important;
            height: 30mm !important;
            background: #ffffff;
            border: 2px dashed #64748b;
            box-sizing: border-box;
            padding: 0;
            position: relative;
            overflow: hidden;
            color: #000000 !important;
            font-family: Tahoma, Arial, sans-serif;
            border-radius: 4px;
        }

        .preview-st-name {
            position: absolute;
            top: 7mm;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: 900;
            color: #000000 !important;
            white-space: nowrap;
            padding: 0 2mm;
            outline: none;
            transition: font-size 0.2s;
        }

        .preview-st-unified {
            position: absolute;
            top: 17mm;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            color: #000000 !important;
            white-space: nowrap;
            outline: none;
        }

        .preview-st-label {
            font-weight: 700;
            font-size: 11px;
        }

        /* =========================================================
           منطقة الطباعة المخفية
        ========================================================= */
        #print-container {
            display: none;
        }

        .thermal-print-image {
            display: block;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: #ffffff;
            image-rendering: auto;
        }

        /* =========================================================
           إعدادات الطباعة: تحايل على الطابعة لإرسال الورقة كـ Portrait
           بمقاس (30 عرض × 50 طول) والكود هيلف الكلام جواها
        ========================================================= */
        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 30mm !important;
                height: 50mm !important;
                background: #ffffff !important;
                color: #000000 !important;
            }

            body { display: block !important; }
            .no-print, .app-container { display: none !important; }

            #print-container {
                display: block !important;
                width: 30mm !important;
                height: 50mm !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            @page {
                size: 30mm 50mm; /* الورقة بالطول Portrait خدعة للمكنة */
                margin: 0;
            }

            .thermal-print-image {
                display: block !important;
                width: 30mm !important;
                height: 50mm !important;
                margin: 0 !important;
                padding: 0 !important;
                page-break-after: always;
                break-after: page;
            }

            .thermal-print-image:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>

<body>

    <div class="app-container no-print">
        <div class="hospital-logo">
            <img src="MEpics/Picture1.png" alt="مستشفى صيدناوي" onerror="this.onerror=null; this.src='TWEAKS/MEpics/Picture1.png';">
        </div>

        <h2>طباعة استيكر المريض</h2>

        <div class="status-row">
            <div id="loading-msg">جاري تحميل البيانات من الشيت... ⏳</div>
            <button type="button" id="refresh-btn" class="btn-refresh" onclick="loadData()" title="تحديث البيانات من الشيت">🔄 تحديث</button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="اكتب اسم المريض للبحث..." autocomplete="off">
            <div id="suggestions" class="suggestions-box"></div>
        </div>

        <div class="copies-box">
            <label for="copies-count">عدد النسخ (الستيكرات):</label>
            <input type="number" id="copies-count" min="1" max="50" value="1">
        </div>

        <div class="preview-section">
            <div class="preview-title">معاينة الاستيكر (الاسم يصغر تلقائياً ليناسب سطر واحد)</div>
            
            <div class="sticker" id="preview-sticker">
                <div class="preview-st-name" id="st-name" contenteditable="true">اسم المريض</div>
                <div class="preview-st-unified">
                    <span class="preview-st-label">رقم موحد:</span>
                    <span id="st-unified-id" contenteditable="true">---</span>
                </div>
            </div>
        </div>

        <button class="btn-print" onclick="printStickers()">🖨️ طباعة الاستيكرات</button>
    </div>

    <div id="print-container"></div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeEUxAcEspHRKlu7XJ6WIyN7__IMKqzSo1iMryvgH1T3upSkuXpkOTb9sSeDQhhuokPe4ZFem3P1mW/pub?gid=95330193&single=true&output=csv";

    let patientsList = [];
    const searchInput = document.getElementById('search-input');
    const suggestionsBox = document.getElementById('suggestions');
    const loadingMsg = document.getElementById('loading-msg');
    const refreshBtn = document.getElementById('refresh-btn');
    const copiesCount = document.getElementById('copies-count');
    const stName = document.getElementById('st-name');
    const stUnifiedId = document.getElementById('st-unified-id');

    // تصغير الخط أوتوماتيك في المعاينة لو الاسم طويل
    function adjustPreviewNameSize() {
        const text = stName.innerText.trim();
        if (text.length > 35) {
            stName.style.fontSize = '12px';
        } else if (text.length > 25) {
            stName.style.fontSize = '14px';
        } else if (text.length > 18) {
            stName.style.fontSize = '17px';
        } else {
            stName.style.fontSize = '21px'; // الخط الأساسي الكبير
        }
    }

    stName.addEventListener('input', adjustPreviewNameSize);

    function normalizeArabic(text) {
        return String(text || '').trim().toLowerCase()
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ة/g, 'ه')
            .replace(/[ؤئ]/g, 'ء')
            .replace(/\s+/g, ' ');
    }

    function parseCSVLine(text) {
        let result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"') {
                if (inQuotes && text[i + 1] === '"') {
                    current += '"'; i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim()); current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim());
        return result;
    }

    let dataStatus = 'loading';

    async function loadData() {
        dataStatus = 'loading';
        refreshBtn.disabled = true;
        loadingMsg.style.display = 'block';
        loadingMsg.innerText = 'جاري تحميل البيانات من الشيت... ⏳';
        loadingMsg.style.color = '#2563eb';

        try {
            const fetchUrl = CSV_URL + '&v=' + Date.now();
            const response = await fetch(fetchUrl);

            if (!response.ok) {
                throw new Error(`الرابط لا يعمل (كود الخطأ: ${response.status}).`);
            }

            let csvText = await response.text();
            csvText = csvText.replace(/^\uFEFF/, ''); 

            const lines = csvText.split(/\r\n|\n/).filter(l => l.trim() !== '');

            if (lines.length < 2) {
                throw new Error("الشيت تم تحميله ولكنه فارغ من البيانات!");
            }

            const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
            const colName = headers.findIndex(h => h.includes('اسم') || h.includes('المريض'));
            const colUnified = headers.findIndex(h => h.includes('موحد') || h.includes('طبي') || h.includes('رقم'));

            if (colName === -1) {
                throw new Error("لم يتم العثور على عمود (اسم المريض) - الأعمدة المتاحة: " + headers.join(" | "));
            }

            const tempPatients = [];

            for (let i = 1; i < lines.length; i++) {
                const cols = parseCSVLine(lines[i]).map(c => c.replace(/^"|"$/g, '').trim());
                if (cols[colName]) {
                    tempPatients.push({
                        name: cols[colName] || '',
                        unifiedId: colUnified !== -1 ? cols[colUnified] : ''
                    });
                }
            }

            patientsList = tempPatients;
            dataStatus = 'ready';

            currentMatches = [];
            activeIndex = -1;
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.remove('open');

            loadingMsg.innerText = `✅ تم سحب ${patientsList.length} مريض جاهزين للطباعة`;
            loadingMsg.style.color = '#10b981';

            setTimeout(() => {
                loadingMsg.style.display = 'none';
            }, 4000);

        } catch (error) {
            console.error("خطأ التحميل:", error);
            loadingMsg.innerText = '⚠️ خطأ: ' + error.message;
            loadingMsg.style.color = '#dc2626';
            dataStatus = 'error';
        } finally {
            refreshBtn.disabled = false;
        }
    }

    function renderActiveHighlight() {
        const items = suggestionsBox.querySelectorAll('.suggestion-item[data-idx]');
        items.forEach(el => el.classList.remove('active'));
        if (activeIndex >= 0 && items[activeIndex]) {
            items[activeIndex].classList.add('active');
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    searchInput.addEventListener('input', (e) => {
        const query = normalizeArabic(e.target.value);
        suggestionsBox.innerHTML = '';
        activeIndex = -1;
        selectedPatient = null;

        if (!query) {
            suggestionsBox.classList.remove('open');
            currentMatches = [];
            return;
        }

        currentMatches = patientsList
            .filter(p => normalizeArabic(p.name).includes(query))
            .slice(0, 10);

        if (currentMatches.length === 0) {
            suggestionsBox.innerHTML = '<div class="suggestion-item" style="color:#94a3b8;">لا يوجد نتائج...</div>';
        } else {
            currentMatches.forEach((patient, idx) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.dataset.idx = idx;
                div.innerText = patient.name;
                div.onmousedown = (ev) => {
                    ev.preventDefault();
                    activeIndex = idx;
                    fillSticker(patient);
                };
                suggestionsBox.appendChild(div);
            });
        }
        suggestionsBox.classList.add('open');
    });

    searchInput.addEventListener('keydown', (e) => {
        if (!suggestionsBox.classList.contains('open') || currentMatches.length === 0) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = (activeIndex + 1) % currentMatches.length;
            renderActiveHighlight();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = (activeIndex - 1 + currentMatches.length) % currentMatches.length;
            renderActiveHighlight();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && currentMatches[activeIndex]) {
                fillSticker(currentMatches[activeIndex]);
            }
        } else if (e.key === 'Escape') {
            suggestionsBox.classList.remove('open');
        }
    });

    searchInput.addEventListener('blur', () =>
        setTimeout(() => suggestionsBox.classList.remove('open'), 150)
    );

    let selectedPatient = null;

    function fillSticker(patient) {
        selectedPatient = patient;
        searchInput.value = patient.name;
        suggestionsBox.classList.remove('open');
        
        stName.innerText = patient.name || "---";
        stUnifiedId.innerText = patient.unifiedId || "---";

        adjustPreviewNameSize();
    }

    function loadLogoImage() {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                const fallback = new Image();
                fallback.onload = () => resolve(fallback);
                fallback.onerror = reject;
                fallback.src = 'TWEAKS/MEpics/sidnawi_thermal_logo.png';
            };
            img.src = 'MEpics/sidnawi_thermal_logo.png';
        });
    }

    function drawTextRTL(ctx, text, x, y, font, maxWidth) {
        ctx.save();
        ctx.direction = 'rtl';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = font;
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 0.35;
        ctx.strokeText(text, x, y, maxWidth);
        ctx.fillText(text, x, y, maxWidth);
        ctx.restore();
    }

    /* 
       توليد الاستيكر الحراري للطباعة بخدعة الـ Portrait
       بنعمل الـ Canvas بالطول (240×400) ونلف الكلام جواه 90 درجة 
    */
    async function createThermalSticker() {
        const canvas = document.createElement('canvas');
        
        // الأبعاد المقلوبة للطباعة الطولية (30mm عرض و 50mm طول)
        canvas.width = 240;  
        canvas.height = 400; 

        const ctx = canvas.getContext('2d', { alpha: false });

        // خلفية بيضاء
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();

        // الخدعة: لفة 90 درجة عشان الكلام يطبع بالعرض جوه الورقة اللي مسحوبة بالطول
        ctx.translate(240, 0);
        ctx.rotate(90 * Math.PI / 180);

        // مساحة الرسم المنطقية اللي بنرسم جواها براحتنا كأنها بالعرض
        const LOGICAL_WIDTH = 400;
        const LOGICAL_HEIGHT = 240;

        const name = stName.innerText.trim() || '---';
        const unified = stUnifiedId.innerText.trim() || '---';

        // إضافة اللوجو
        try {
            const logo = await loadLogoImage();
            const maxLogoWidth = 90;
            const maxLogoHeight = 32;

            const ratio = Math.min(
                maxLogoWidth / logo.naturalWidth,
                maxLogoHeight / logo.naturalHeight
            );

            const logoWidth = logo.naturalWidth * ratio;
            const logoHeight = logo.naturalHeight * ratio;

            const logoX = 20; 
            const logoY = LOGICAL_HEIGHT - logoHeight - 15; 

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(logo, logoX, logoY, logoWidth, logoHeight);
        } catch (error) {
            console.warn('Logo could not be loaded', error);
        }

        // رسم الاسم مع تصغير الخط إذا كان طويلاً
        let nameFontSize = 45;
        if (name.length > 18) nameFontSize = 38;
        if (name.length > 28) nameFontSize = 32;
        if (name.length > 38) nameFontSize = 26;

        drawTextRTL(
            ctx,
            name,
            LOGICAL_WIDTH / 2,
            58, 
            `900 ${nameFontSize}px Tahoma, Arial, sans-serif`,
            380
        );

        // رسم الرقم الموحد
        const unifiedText = `رقم موحد: ${unified}`;
        drawTextRTL(
            ctx,
            unifiedText,
            LOGICAL_WIDTH / 2,
            125, 
            `900 28px Tahoma, Arial, sans-serif`,
            380
        );

        ctx.restore();

        return canvas.toDataURL('image/png');
    }

    async function printStickers() {
        const printContainer = document.getElementById('print-container');

        if (dataStatus === 'loading') {
            const proceed = confirm('⏳ البيانات لسه بتتحمل من الشيت. هل تحب تكمل الطباعة برضه؟');
            if (!proceed) return;
        }

        if (!selectedPatient && stName.innerText.trim() === 'اسم المريض') {
            const proceed = confirm('⚠️ لسه معملتش بحث عن مريض، والاستيكر لسه فاضي. هل تحب تكمل الطباعة؟');
            if (!proceed) return;
        }

        let copies = parseInt(copiesCount.value, 10);
        if (isNaN(copies) || copies < 1) copies = 1;
        if (copies > 50) copies = 50;

        const printButton = document.querySelector('.btn-print');
        const oldButtonText = printButton.innerText;
        printButton.disabled = true;
        printButton.innerText = '⏳ تجهيز الطباعة...';

        try {
            printContainer.innerHTML = '';
            
            // استخراج صورة الطباعة الطولية اللي الكود لاففها
            const imageData = await createThermalSticker();

            for (let i = 0; i < copies; i++) {
                const img = document.createElement('img');
                img.className = 'thermal-print-image';
                img.src = imageData;
                printContainer.appendChild(img);
            }

            await new Promise(resolve =>
                requestAnimationFrame(() =>
                    requestAnimationFrame(resolve)
                )
            );

            window.print();
        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء تجهيز الاستيكر للطباعة.');
        } finally {
            printButton.disabled = false;
            printButton.innerText = oldButtonText;
        }
    }

    adjustPreviewNameSize();
    loadData();
</script>

</body>
</html>
