<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>طباعة استيكر المريض</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* =====================================================
               XP-233B
               203 DPI
               50mm × 30mm
            ===================================================== */

            --label-width: 50mm;
            --label-height: 30mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;

            background-color: #f1f5f9;

            margin: 0;
            padding: 20px;

            color: #0f172a;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================================================
           واجهة البرنامج
        ========================================================= */

        .app-container {
            width: 100%;
            max-width: 500px;

            background: #fff;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);

            margin-bottom: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        .hospital-logo {
            text-align: center;
            margin-bottom: 10px;
        }


        .hospital-logo img {
            max-width: 120px;
            height: auto;
        }


        h2 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 20px;

            color: #1e293b;
        }


        /* =========================================================
           البحث
        ========================================================= */

        .search-box {
            position: relative;

            margin-bottom: 20px;

            width: 100%;
        }


        .search-input {
            width: 100%;

            padding: 12px 15px;

            border: 2px solid #cbd5e1;

            border-radius: 8px;

            font-family: inherit;

            font-size: 15px;

            font-weight: 600;

            box-sizing: border-box;

            outline: none;

            transition:
                border-color 0.2s;
        }


        .search-input:focus {
            border-color: #3b82f6;
        }


        .suggestions-box {
            display: none;

            position: absolute;

            top: 100%;

            right: 0;
            left: 0;

            z-index: 1000;

            background: #ffffff;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.15);

            max-height: 200px;

            overflow-y: auto;

            margin-top: 5px;
        }


        .suggestions-box.open {
            display: block;
        }


        .suggestion-item {
            padding: 10px 12px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            border-bottom:
                1px solid #f1f5f9;
        }


        .suggestion-item:hover {
            background-color: #eff6ff;
        }


        .suggestion-item.active {
            background-color: #dbeafe;
        }


        .suggestion-item:last-child {
            border-bottom: none;
        }


        /* =========================================================
           حالة التحميل
        ========================================================= */

        .status-row {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            width: 100%;

            margin-bottom: 15px;
        }


        #loading-msg {
            text-align: center;

            font-size: 13px;

            font-weight: bold;

            color: #2563eb;

            min-height: 20px;

            flex: 1;
        }


        .btn-refresh {
            flex-shrink: 0;

            background: #eff6ff;

            color: #2563eb;

            border: 1px solid #bfdbfe;

            border-radius: 6px;

            padding: 6px 10px;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }


        .btn-refresh:hover {
            background: #dbeafe;
        }


        .btn-refresh:disabled {
            opacity: 0.6;

            cursor: default;
        }


        /* =========================================================
           عدد النسخ
        ========================================================= */

        .copies-box {
            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-bottom: 20px;

            background: #f8fafc;

            padding: 10px;

            border-radius: 8px;

            border: 1px solid #e2e8f0;
        }


        .copies-box label {
            font-weight: bold;

            color: #0f172a;

            font-size: 15px;
        }


        .copies-box input {
            width: 70px;

            padding: 8px;

            text-align: center;

            font-size: 16px;

            font-weight: bold;

            font-family: inherit;

            border: 2px solid #cbd5e1;

            border-radius: 6px;

            outline: none;
        }


        .copies-box input:focus {
            border-color: #10b981;
        }


        /* =========================================================
           المعاينة
        ========================================================= */

        .preview-section {
            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 20px;
        }


        .preview-title {
            font-size: 13px;

            color: #64748b;

            margin-bottom: 10px;

            font-weight: bold;

            text-align: center;
        }


        /* =========================================================
           زر الطباعة
        ========================================================= */

        .btn-print {
            background: #10b981;

            color: #fff;

            border: none;

            width: 100%;

            padding: 15px;

            font-family: inherit;

            font-size: 18px;

            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(16,185,129,0.3);

            transition:
                transform 0.1s;
        }


        .btn-print:active {
            transform: scale(0.97);
        }


        .btn-print:disabled {
            opacity: 0.7;

            cursor: wait;
        }


        /* =========================================================
           الاستيكر الخاص بالمعاينة
        ========================================================= */

        .sticker {
            width: var(--label-width);

            height: var(--label-height);

            background: #ffffff;

            border: 1px dashed #000000;

            box-sizing: border-box;

            padding: 2mm;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            align-items: center;

            overflow: hidden;

            color: #000000 !important;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            -webkit-font-smoothing: none;

            -moz-osx-font-smoothing: grayscale;

            text-rendering: geometricPrecision;

            -webkit-print-color-adjust:
                exact !important;

            print-color-adjust:
                exact !important;
        }


        /* =========================================================
           اللوجو في المعاينة
           يستخدم اللوجو الأصلي
        ========================================================= */

        .st-logo {
            height: 9mm;

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 2px;
        }


        .st-logo img {
            max-height: 100%;

            max-width: 40mm;

            object-fit: contain;
        }


        /* =========================================================
           اسم المريض في المعاينة
        ========================================================= */

        .st-name {
            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 15px;

            font-weight: 900;

            color: #000000 !important;

            text-align: center;

            width: 100%;

            white-space: normal;

            line-height: 1.2;

            max-height: 35px;

            overflow: hidden;

            padding-bottom: 2px;

            margin-bottom: 2px;

            -webkit-text-stroke:
                0.15px #000000;
        }


        /* =========================================================
           الرقم الموحد
        ========================================================= */

        .st-unified {
            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-size: 14px;

            font-weight: 900;

            color: #000000 !important;

            text-align: center;

            width: 100%;

            white-space: nowrap;

            -webkit-text-stroke:
                0.1px #000000;
        }


        .st-label {
            font-family:
                Tahoma,
                Arial,
                sans-serif;

            font-weight: 700;

            font-size: 12px;

            color: #000000 !important;
        }


        /* =========================================================
           منطقة الطباعة
        ========================================================= */

        #print-container {
            display: none;
        }


        /*
            Bitmap الخاص بالطباعة

            400 × 240 pixels

            50 × 30 mm

            203 DPI تقريباً
        */

        .thermal-print-image {
            display: block;

            width: 50mm !important;

            height: 30mm !important;

            margin: 0 !important;

            padding: 0 !important;

            border: none !important;

            background: #ffffff;

            image-rendering: auto;
        }


        /* =========================================================
           إعدادات الطباعة
        ========================================================= */

        @media print {

            * {
                -webkit-print-color-adjust:
                    exact !important;

                print-color-adjust:
                    exact !important;
            }


            html,
            body {
                margin: 0 !important;

                padding: 0 !important;

                width: 50mm !important;

                background: #ffffff !important;

                color: #000000 !important;
            }


            body {
                display: block !important;
            }


            .no-print,
            .app-container {
                display: none !important;
            }


            #print-container {
                display: block !important;

                width: 50mm !important;

                margin: 0 !important;

                padding: 0 !important;
            }


            @page {
                size: 50mm 30mm;

                margin: 0;
            }


            .thermal-print-image {
                display: block !important;

                width: 50mm !important;

                height: 30mm !important;

                margin: 0 !important;

                padding: 0 !important;

                page-break-after: always;

                break-after: page;

                background: #ffffff !important;

                -webkit-print-color-adjust:
                    exact !important;

                print-color-adjust:
                    exact !important;
            }


            .thermal-print-image:last-child {
                page-break-after: auto;

                break-after: auto;
            }
        }
    </style>
</head>


<body>


    <!-- =========================================================
         واجهة البرنامج
    ========================================================= -->

    <div class="app-container no-print">


        <!-- اللوجو الأصلي للواجهة فقط -->

        <div class="hospital-logo">

            <img
                src="MEpics/Picture1.png"
                alt="مستشفى صيدناوي"
                onerror="
                    this.onerror=null;
                    this.src='TWEAKS/MEpics/Picture1.png';
                "
            >

        </div>


        <h2>
            طباعة استيكر المريض
        </h2>


        <!-- =====================================================
             حالة البيانات
        ===================================================== -->

        <div class="status-row">

            <div id="loading-msg">
                جاري تحميل البيانات من الشيت... ⏳
            </div>


            <button
                type="button"
                id="refresh-btn"
                class="btn-refresh"
                onclick="loadData()"
                title="تحديث البيانات من الشيت"
            >
                🔄 تحديث
            </button>

        </div>


        <!-- =====================================================
             البحث
        ===================================================== -->

        <div class="search-box">

            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="اكتب اسم المريض للبحث..."
                autocomplete="off"
            >


            <div
                id="suggestions"
                class="suggestions-box"
            ></div>

        </div>


        <!-- =====================================================
             عدد النسخ
        ===================================================== -->

        <div class="copies-box">

            <label for="copies-count">
                عدد النسخ (الستيكرات):
            </label>


            <input
                type="number"
                id="copies-count"
                min="1"
                max="50"
                value="1"
            >

        </div>


        <!-- =====================================================
             المعاينة
        ===================================================== -->

        <div class="preview-section">

            <div class="preview-title">

                معاينة الاستيكر

                <br>

                يمكن تعديل النص يدوياً قبل الطباعة

            </div>


            <div
                class="sticker"
                id="preview-sticker"
            >


                <!-- اللوجو الأصلي للمعاينة -->

                <div class="st-logo">

                    <img
                        src="MEpics/Picture1.png"
                        alt="Logo"
                        onerror="
                            this.onerror=null;
                            this.src='TWEAKS/MEpics/Picture1.png';
                        "
                    >

                </div>


                <!-- اسم المريض -->

                <div
                    class="st-name"
                    id="st-name"
                    contenteditable="true"
                >
                    اسم المريض
                </div>


                <!-- الرقم الموحد -->

                <div class="st-unified">

                    <span class="st-label">
                        رقم موحد:
                    </span>


                    <span
                        id="st-unified-id"
                        contenteditable="true"
                    >
                        ---
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
             زر الطباعة
        ===================================================== -->

        <button
            class="btn-print"
            onclick="printStickers()"
        >
            🖨️ طباعة الاستيكرات
        </button>

    </div>


    <!-- =========================================================
         حاوية الطباعة
    ========================================================= -->

    <div id="print-container"></div>


<script>


    /* =========================================================
       إعدادات الطباعة الحرارية
    ========================================================= */


    const PRINT_DPI = 203;


    /*
        XP-233B

        50mm × 203 DPI
        ≈ 400 pixels

        30mm × 203 DPI
        ≈ 240 pixels
    */


    const PRINT_WIDTH = 400;

    const PRINT_HEIGHT = 240;



    /* =========================================================
       رابط Google Sheets
    ========================================================= */


    const CSV_URL =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeEUxAcEspHRKlu7XJ6WIyN7__IMKqzSo1iMryvgH1T3upSkuXpkOTb9sSeDQhhuokPe4ZFem3P1mW/pub?gid=95330193&single=true&output=csv";



    /* =========================================================
       عناصر الصفحة
    ========================================================= */


    let patientsList = [];


    const searchInput =
        document.getElementById(
            'search-input'
        );


    const suggestionsBox =
        document.getElementById(
            'suggestions'
        );


    const loadingMsg =
        document.getElementById(
            'loading-msg'
        );


    const refreshBtn =
        document.getElementById(
            'refresh-btn'
        );


    const copiesCount =
        document.getElementById(
            'copies-count'
        );


    const stName =
        document.getElementById(
            'st-name'
        );


    const stUnifiedId =
        document.getElementById(
            'st-unified-id'
        );



    /* =========================================================
       توحيد البحث العربي
    ========================================================= */


    function normalizeArabic(text) {

        return String(text || '')
            .trim()
            .toLowerCase()

            .replace(
                /[\u064B-\u065F\u0670]/g,
                ''
            )

            .replace(
                /[أإآٱ]/g,
                'ا'
            )

            .replace(
                /ى/g,
                'ي'
            )

            .replace(
                /ة/g,
                'ه'
            )

            .replace(
                /[ؤئ]/g,
                'ء'
            )

            .replace(
                /\s+/g,
                ' '
            );
    }



    /* =========================================================
       قراءة CSV
    ========================================================= */


    function parseCSVLine(text) {

        let result = [];

        let current = '';

        let inQuotes = false;


        for (
            let i = 0;
            i < text.length;
            i++
        ) {

            const char = text[i];


            if (char === '"') {

                if (
                    inQuotes &&
                    text[i + 1] === '"'
                ) {

                    current += '"';

                    i++;

                }

                else {

                    inQuotes =
                        !inQuotes;
                }
            }


            else if (
                char === ',' &&
                !inQuotes
            ) {

                result.push(
                    current.trim()
                );

                current = '';
            }


            else {

                current += char;
            }
        }


        result.push(
            current.trim()
        );


        return result;
    }



    let dataStatus = 'loading';



    /* =========================================================
       تحميل البيانات من الشيت
    ========================================================= */


    async function loadData() {

        dataStatus = 'loading';

        refreshBtn.disabled = true;


        loadingMsg.style.display =
            'block';


        loadingMsg.innerText =
            'جاري تحميل البيانات من الشيت... ⏳';


        loadingMsg.style.color =
            '#2563eb';


        try {

            const response =
                await fetch(
                    CSV_URL +
                    (
                        CSV_URL.includes('?')
                            ? '&'
                            : '?'
                    ) +
                    'cachebust=' +
                    Date.now()
                );


            if (!response.ok) {

                throw new Error(
                    "Error fetching CSV"
                );
            }


            const csvText =
                await response.text();


            const lines =
                csvText
                    .split(/\r\n|\n/)
                    .filter(
                        l =>
                            l.trim() !== ''
                    );


            if (lines.length < 2) {

                loadingMsg.innerText =
                    '⚠️ لا توجد بيانات في الشيت';


                loadingMsg.style.color =
                    '#dc2626';


                dataStatus =
                    'error';


                refreshBtn.disabled =
                    false;


                return;
            }



            /* =================================================
               قراءة العناوين
            ================================================= */


            const headers =
                parseCSVLine(lines[0])
                    .map(
                        h =>
                            h
                                .replace(
                                    /^"|"$/g,
                                    ''
                                )
                                .trim()
                    );


            const colName =
                headers.findIndex(
                    h =>
                        h.includes('اسم') ||
                        h.includes('المريض')
                );


            const colUnified =
                headers.findIndex(
                    h =>
                        h.includes('موحد') ||
                        h.includes('طبي')
                );


            patientsList = [];



            /* =================================================
               قراءة المرضى
            ================================================= */


            for (
                let i = 1;
                i < lines.length;
                i++
            ) {

                const cols =
                    parseCSVLine(lines[i])
                        .map(
                            c =>
                                c
                                    .replace(
                                        /^"|"$/g,
                                        ''
                                    )
                                    .trim()
                        );


                if (
                    colName !== -1 &&
                    cols[colName]
                ) {

                    patientsList.push({

                        name:
                            cols[colName] || '',

                        unifiedId:
                            colUnified !== -1
                                ? cols[colUnified]
                                : ''

                    });
                }
            }



            /* =================================================
               نجاح التحميل
            ================================================= */


            loadingMsg.innerText =
                `✅ تم سحب ${patientsList.length} مريض جاهزين للطباعة`;


            loadingMsg.style.color =
                '#10b981';


            dataStatus =
                'ready';


            refreshBtn.disabled =
                false;


            setTimeout(
                () => {

                    loadingMsg.style.display =
                        'none';

                },
                3000
            );

        }


        catch (error) {

            console.error(error);


            loadingMsg.innerText =
                '⚠️ حدث خطأ في الاتصال بالشيت (يرجى مراجعة الرابط)';


            loadingMsg.style.color =
                '#dc2626';


            dataStatus =
                'error';


            refreshBtn.disabled =
                false;
        }
    }



    /* =========================================================
       البحث والمقترحات
    ========================================================= */


    let currentMatches = [];

    let activeIndex = -1;

    let selectedPatient = null;



    function renderActiveHighlight() {

        const items =
            suggestionsBox.querySelectorAll(
                '.suggestion-item[data-idx]'
            );


        items.forEach(
            el =>
                el.classList.remove(
                    'active'
                )
        );


        if (
            activeIndex >= 0 &&
            items[activeIndex]
        ) {

            items[activeIndex]
                .classList.add(
                    'active'
                );


            items[activeIndex]
                .scrollIntoView({
                    block: 'nearest'
                });
        }
    }



    searchInput.addEventListener(
        'input',
        (e) => {

            const query =
                normalizeArabic(
                    e.target.value
                );


            suggestionsBox.innerHTML =
                '';


            activeIndex =
                -1;


            selectedPatient =
                null;


            if (!query) {

                suggestionsBox
                    .classList
                    .remove('open');


                currentMatches =
                    [];


                return;
            }



            currentMatches =
                patientsList
                    .filter(
                        p =>
                            normalizeArabic(
                                p.name
                            ).includes(query)
                    )
                    .slice(
                        0,
                        10
                    );



            if (
                currentMatches.length === 0
            ) {

                suggestionsBox.innerHTML =
                    '<div class="suggestion-item" style="color:#94a3b8;">لا يوجد نتائج...</div>';

            }


            else {

                currentMatches.forEach(
                    (
                        patient,
                        idx
                    ) => {

                        const div =
                            document.createElement(
                                'div'
                            );


                        div.className =
                            'suggestion-item';


                        div.dataset.idx =
                            idx;


                        div.innerText =
                            patient.name;


                        div.onmousedown =
                            (ev) => {

                                ev.preventDefault();


                                activeIndex =
                                    idx;


                                fillSticker(
                                    patient
                                );
                            };


                        suggestionsBox
                            .appendChild(
                                div
                            );
                    }
                );
            }


            suggestionsBox
                .classList
                .add('open');
        }
    );



    /* =========================================================
       لوحة المفاتيح
    ========================================================= */


    searchInput.addEventListener(
        'keydown',
        (e) => {

            if (
                !suggestionsBox
                    .classList
                    .contains('open') ||
                currentMatches.length === 0
            ) {

                return;
            }


            if (
                e.key === 'ArrowDown'
            ) {

                e.preventDefault();


                activeIndex =
                    (
                        activeIndex +
                        1
                    ) %
                    currentMatches.length;


                renderActiveHighlight();
            }


            else if (
                e.key === 'ArrowUp'
            ) {

                e.preventDefault();


                activeIndex =
                    (
                        activeIndex -
                        1 +
                        currentMatches.length
                    ) %
                    currentMatches.length;


                renderActiveHighlight();
            }


            else if (
                e.key === 'Enter'
            ) {

                e.preventDefault();


                if (
                    activeIndex >= 0 &&
                    currentMatches[
                        activeIndex
                    ]
                ) {

                    fillSticker(
                        currentMatches[
                            activeIndex
                        ]
                    );
                }
            }


            else if (
                e.key === 'Escape'
            ) {

                suggestionsBox
                    .classList
                    .remove('open');
            }
        }
    );



    searchInput.addEventListener(
        'blur',
        () => {

            setTimeout(
                () => {

                    suggestionsBox
                        .classList
                        .remove('open');

                },
                150
            );
        }
    );



    /* =========================================================
       تعبئة الاستيكر
    ========================================================= */


    function fillSticker(patient) {

        selectedPatient =
            patient;


        searchInput.value =
            patient.name;


        suggestionsBox
            .classList
            .remove('open');


        stName.innerText =
            patient.name || "---";


        stUnifiedId.innerText =
            patient.unifiedId || "---";
    }



    /* =========================================================
       تحميل اللوجو الحراري
       
       مهم:
       هذا اللوجو يستخدم للطباعة فقط.
       
       المعاينة تظل باستخدام Picture1.png
    ========================================================= */


    function loadLogoImage() {

        return new Promise(
            (resolve, reject) => {

                const img =
                    new Image();


                img.onload =
                    () => {

                        resolve(img);
                    };


                img.onerror =
                    () => {

                        const fallback =
                            new Image();


                        fallback.onload =
                            () => {

                                resolve(
                                    fallback
                                );
                            };


                        fallback.onerror =
                            reject;


                        fallback.src =
                            'TWEAKS/MEpics/sidnawi_thermal_logo.png';
                    };


                /*
                   اللوجو الأسود المخصص
                   للطباعة الحرارية
                */

                img.src =
                    'MEpics/sidnawi_thermal_logo.png';
            }
        );
    }



    /* =========================================================
       رسم النص العربي على Canvas
       
       دعم RTL
       
       عربي + أرقام + رموز
    ========================================================= */


    function drawTextRTL(
        ctx,
        text,
        x,
        y,
        font,
        maxWidth
    ) {

        ctx.save();


        /* -----------------------------------------------------
           اتجاه الـ Canvas نفسه RTL
        ----------------------------------------------------- */

        ctx.canvas.dir =
            'rtl';


        /* -----------------------------------------------------
           اتجاه النص RTL
        ----------------------------------------------------- */

        ctx.direction =
            'rtl';


        /* -----------------------------------------------------
           المحاذاة
        ----------------------------------------------------- */

        ctx.textAlign =
            'center';


        ctx.textBaseline =
            'middle';


        /* -----------------------------------------------------
           الخط
        ----------------------------------------------------- */

        ctx.font =
            font;


        /* -----------------------------------------------------
           الأسود الخالص
        ----------------------------------------------------- */

        ctx.fillStyle =
            '#000000';


        ctx.strokeStyle =
            '#000000';


        /* -----------------------------------------------------
           زيادة بسيطة في سماكة الحروف
        ----------------------------------------------------- */

        ctx.lineWidth =
            0.35;


        /* -----------------------------------------------------
           Stroke
        ----------------------------------------------------- */

        ctx.strokeText(
            text,
            x,
            y,
            maxWidth
        );


        /* -----------------------------------------------------
           Fill
        ----------------------------------------------------- */

        ctx.fillText(
            text,
            x,
            y,
            maxWidth
        );


        ctx.restore();
    }



    /* =========================================================
       إنشاء Bitmap للاستكر
    ========================================================= */


    async function createThermalSticker() {

        /* -----------------------------------------------------
           إنشاء Canvas
        ----------------------------------------------------- */

        const canvas =
            document.createElement(
                'canvas'
            );


        canvas.width =
            PRINT_WIDTH;


        canvas.height =
            PRINT_HEIGHT;


        /* -----------------------------------------------------
           RTL للـ Canvas بالكامل
        ----------------------------------------------------- */

        canvas.dir =
            'rtl';



        /* -----------------------------------------------------
           Context
        ----------------------------------------------------- */

        const ctx =
            canvas.getContext(
                '2d',
                {
                    alpha: false
                }
            );



        /* -----------------------------------------------------
           RTL للـ Context
        ----------------------------------------------------- */

        ctx.direction =
            'rtl';



        /* -----------------------------------------------------
           خلفية بيضاء خالصة
        ----------------------------------------------------- */

        ctx.fillStyle =
            '#ffffff';


        ctx.fillRect(
            0,
            0,
            PRINT_WIDTH,
            PRINT_HEIGHT
        );



        /* -----------------------------------------------------
           بيانات المريض الحالية
        ----------------------------------------------------- */

        const name =
            stName.innerText
                .trim() ||
            '---';


        const unified =
            stUnifiedId.innerText
                .trim() ||
            '---';



        /* =====================================================
           اللوجو الحراري
        ===================================================== */


        try {

            const logo =
                await loadLogoImage();


            /*
               أقصى مساحة للوجو
            */

            const maxLogoWidth =
                320;


            const maxLogoHeight =
                72;


            const ratio =
                Math.min(

                    maxLogoWidth /
                        logo.naturalWidth,

                    maxLogoHeight /
                        logo.naturalHeight
                );


            const logoWidth =
                logo.naturalWidth *
                ratio;


            const logoHeight =
                logo.naturalHeight *
                ratio;


            const logoX =
                (
                    PRINT_WIDTH -
                    logoWidth
                ) / 2;


            const logoY =
                8;



            /*
               إيقاف تنعيم الصورة
               للحفاظ على حدة الطباعة
            */

            ctx.imageSmoothingEnabled =
                false;


            ctx.drawImage(
                logo,

                logoX,
                logoY,

                logoWidth,
                logoHeight
            );

        }


        catch (error) {

            console.warn(
                'Logo could not be loaded',
                error
            );
        }



        /* =====================================================
           اسم المريض
        ===================================================== */


        let nameText =
            name;


        let nameFontSize =
            38;


        /*
           تصغير الخط تلقائياً
           لو الاسم طويل
        */

        if (
            nameText.length > 24
        ) {

            nameFontSize =
                34;
        }


        if (
            nameText.length > 32
        ) {

            nameFontSize =
                30;
        }


        if (
            nameText.length > 40
        ) {

            nameFontSize =
                27;
        }



        drawTextRTL(

            ctx,

            nameText,

            PRINT_WIDTH / 2,

            135,

            `900 ${nameFontSize}px Tahoma, Arial, sans-serif`,

            370
        );



        /* =====================================================
           الرقم الموحد
        ===================================================== */


        const unifiedText =
            `رقم موحد: ${unified}`;


        drawTextRTL(

            ctx,

            unifiedText,

            PRINT_WIDTH / 2,

            207,

            `900 31px Tahoma, Arial, sans-serif`,

            380
        );



        /* =====================================================
           Canvas → PNG
        ===================================================== */


        return canvas.toDataURL(
            'image/png'
        );
    }



    /* =========================================================
       طباعة الاستيكرات
    ========================================================= */


    async function printStickers() {

        const printContainer =
            document.getElementById(
                'print-container'
            );



        /* =====================================================
           التحقق من البيانات
        ===================================================== */


        if (
            dataStatus === 'loading'
        ) {

            const proceed =
                confirm(
                    '⏳ البيانات لسه بتتحمل من الشيت. هل تحب تكمل الطباعة برضه؟'
                );


            if (!proceed) {

                return;
            }
        }



        if (
            !selectedPatient &&
            stName.innerText.trim() ===
                'اسم المريض'
        ) {

            const proceed =
                confirm(
                    '⚠️ لسه معملتش بحث عن مريض، والاستيكر لسه فاضي. هل تحب تكمل الطباعة؟'
                );


            if (!proceed) {

                return;
            }
        }



        /* =====================================================
           عدد النسخ
        ===================================================== */


        let copies =
            parseInt(
                copiesCount.value,
                10
            );


        if (
            isNaN(copies) ||
            copies < 1
        ) {

            copies = 1;
        }


        if (
            copies > 50
        ) {

            copies = 50;
        }



        if (
            copies > 10
        ) {

            const proceed =
                confirm(
                    `عدد النسخ المطلوب ${copies} استيكر. هل أنت متأكد؟`
                );


            if (!proceed) {

                return;
            }
        }



        /* =====================================================
           زر الطباعة
        ===================================================== */


        const printButton =
            document.querySelector(
                '.btn-print'
            );


        const oldButtonText =
            printButton.innerText;


        printButton.disabled =
            true;


        printButton.innerText =
            '⏳ تجهيز الطباعة...';



        try {

            /* -------------------------------------------------
               تنظيف الحاوية
            ------------------------------------------------- */

            printContainer.innerHTML =
                '';



            /* -------------------------------------------------
               إنشاء Bitmap واحد
            ------------------------------------------------- */

            const imageData =
                await createThermalSticker();



            /* -------------------------------------------------
               إنشاء النسخ
            ------------------------------------------------- */

            const imagePromises =
                [];


            for (
                let i = 0;
                i < copies;
                i++
            ) {

                const img =
                    document.createElement(
                        'img'
                    );


                img.className =
                    'thermal-print-image';


                img.width =
                    PRINT_WIDTH;


                img.height =
                    PRINT_HEIGHT;


                img.src =
                    imageData;


                printContainer
                    .appendChild(
                        img
                    );


                /*
                   انتظار تحميل الصورة
                   قبل الطباعة
                */

                if (
                    img.decode
                ) {

                    imagePromises.push(
                        img.decode()
                            .catch(
                                () => {}
                            )
                    );

                }

                else {

                    imagePromises.push(
                        new Promise(
                            resolve => {

                                if (
                                    img.complete
                                ) {

                                    resolve();

                                }

                                else {

                                    img.onload =
                                        resolve;

                                    img.onerror =
                                        resolve;
                                }
                            }
                        )
                    );
                }
            }



            /* -------------------------------------------------
               التأكد أن كل الصور جاهزة
            ------------------------------------------------- */

            await Promise.all(
                imagePromises
            );



            /* -------------------------------------------------
               إعطاء المتصفح فرصة لإكمال الرسم
            ------------------------------------------------- */

            await new Promise(
                resolve => {

                    requestAnimationFrame(
                        () => {

                            requestAnimationFrame(
                                resolve
                            );
                        }
                    );
                }
            );



            /* -------------------------------------------------
               الطباعة
            ------------------------------------------------- */

            window.print();

        }


        catch (error) {

            console.error(
                error
            );


            alert(
                'حدث خطأ أثناء تجهيز الاستيكر للطباعة.'
            );
        }


        finally {

            printButton.disabled =
                false;


            printButton.innerText =
                oldButtonText;
        }
    }



    /* =========================================================
       تحميل البيانات عند فتح الصفحة
    ========================================================= */


    loadData();

</script>
