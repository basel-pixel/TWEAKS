<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>طباعة استيكر المريض</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --label-width: 50mm;
            --label-height: 30mm;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            color: #0f172a;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 10px;
        }

        .hospital-logo img {
            max-width: 120px;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;

            border: 2px solid #cbd5e1;
            border-radius: 8px;

            font-family: inherit;
            font-size: 15px;
            font-weight: 600;

            box-sizing: border-box;
            outline: none;

            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .suggestions-box {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            z-index: 1000;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-height: 200px;
            overflow-y: auto;
            margin-top: 5px;
        }

        .suggestions-box.open {
            display: block;
        }

        .suggestion-item {
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }

        .suggestion-item:hover {
            background-color: #eff6ff;
        }

        .suggestion-item.active {
            background-color: #dbeafe;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 15px;
        }

        #loading-msg {
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #2563eb;
            min-height: 20px;
            flex: 1;
        }

        .btn-refresh {
            flex-shrink: 0;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 6px;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-refresh:hover {
            background: #dbeafe;
        }

        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .copies-box {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .copies-box label {
            font-weight: bold;
            color: #0f172a;
            font-size: 15px;
        }

        .copies-box input {
            width: 70px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            font-family: inherit;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
        }

        .copies-box input:focus {
            border-color: #10b981;
        }

        .preview-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .preview-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .btn-print {
            background: #10b981;
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .btn-print:active {
            transform: scale(0.97);
        }

        /* الاستيكر الخاص بالمعاينة (بدون صورة اللوجو) */
        .sticker {
            width: var(--label-width);
            height: var(--label-height);
            background: #ffffff;
            border: 1px dashed #000000;
            box-sizing: border-box;
            padding: 0;
            position: relative;
            overflow: hidden;
            color: #000000 !important;
            font-family: Tahoma, Arial, sans-serif;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: geometricPrecision;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .preview-st-name {
            position: absolute;
            top: 6mm;
            left: 0;
            right: 0;
            text-align: center;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 18px;
            font-weight: 900;
            color: #000000 !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 2mm;
        }

        .preview-st-unified {
            position: absolute;
            top: 15mm;
            left: 0;
            right: 0;
            text-align: center;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #000000 !important;
            white-space: nowrap;
        }

        .preview-st-label {
            font-weight: 700;
            font-size: 11px;
        }

        #print-container {
            display: none;
        }

        .thermal-print-image {
            display: block;
            width: 50mm !important;
            height: 30mm !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: #ffffff;
            image-rendering: auto;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 50mm !important;
                background: #ffffff !important;
                color: #000000 !important;
            }

            body { display: block !important; }
            .no-print, .app-container { display: none !important; }

            #print-container {
                display: block !important;
                width: 50mm !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            @page {
                size: 50mm 30mm;
                margin: 0;
            }

            .thermal-print-image {
                display: block !important;
                width: 50mm !important;
                height: 30mm !important;
                margin: 0 !important;
                padding: 0 !important;
                page-break-after: always;
                break-after: page;
                background: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .thermal-print-image:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
</head>

<body>

    <div class="app-container no-print">
        <div class="hospital-logo">
            <img src="MEpics/Picture1.png" alt="مستشفى صيدناوي" onerror="this.onerror=null; this.src='TWEAKS/MEpics/Picture1.png';">
        </div>

        <h2>طباعة استيكر المريض</h2>

        <div class="status-row">
            <div id="loading-msg">جاري تحميل البيانات من الشيت... ⏳</div>
            <button type="button" id="refresh-btn" class="btn-refresh" onclick="loadData()" title="تحديث البيانات من الشيت">🔄 تحديث</button>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="اكتب اسم المريض للبحث..." autocomplete="off">
            <div id="suggestions" class="suggestions-box"></div>
        </div>

        <div class="copies-box">
            <label for="copies-count">عدد النسخ (الستيكرات):</label>
            <input type="number" id="copies-count" min="1" max="50" value="1">
        </div>

        <div class="preview-section">
            <div class="preview-title">معاينة الاستيكر (يمكن تعديل النص يدوياً قبل الطباعة)</div>
            
            <div class="sticker" id="preview-sticker">
                <div class="preview-st-name" id="st-name" contenteditable="true">اسم المريض</div>
                <div class="preview-st-unified">
                    <span class="preview-st-label">رقم موحد:</span>
                    <span id="st-unified-id" contenteditable="true">---</span>
                </div>
            </div>
        </div>

        <button class="btn-print" onclick="printStickers()">🖨️ طباعة الاستيكرات</button>
    </div>

    <div id="print-container"></div>

<script>
    const PRINT_DPI = 203;
    const PRINT_WIDTH = 400;
    const PRINT_HEIGHT = 240;

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeEUxAcEspHRKlu7XJ6WIyN7__IMKqzSo1iMryvgH1T3upSkuXpkOTb9sSeDQhhuokPe4ZFem3P1mW/pub?gid=95330193&single=true&output=csv";

    let patientsList = [];
    const searchInput = document.getElementById('search-input');
    const suggestionsBox = document.getElementById('suggestions');
    const loadingMsg = document.getElementById('loading-msg');
    const refreshBtn = document.getElementById('refresh-btn');
    const copiesCount = document.getElementById('copies-count');
    const stName = document.getElementById('st-name');
    const stUnifiedId = document.getElementById('st-unified-id');

    function normalizeArabic(text) {
        return String(text || '').trim().toLowerCase()
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ة/g, 'ه')
            .replace(/[ؤئ]/g, 'ء')
            .replace(/\s+/g, ' ');
    }

    /*
       قارئ CSV كامل:
       يدعم الفواصل داخل الخلايا وعلامات الاقتباس وحتى أسطر جديدة داخل الخلية.
    */
    function parseCSV(text) {
        const rows = [];
        let row = [];
        let cell = '';
        let inQuotes = false;

        text = String(text || '').replace(/^\uFEFF/, '');

        for (let i = 0; i < text.length; i++) {
            const char = text[i];

            if (char === '"') {
                if (inQuotes && text[i + 1] === '"') {
                    cell += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                row.push(cell.trim());
                cell = '';
            } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && text[i + 1] === '\n') i++;

                row.push(cell.trim());
                cell = '';

                if (row.some(value => String(value).trim() !== '')) {
                    rows.push(row);
                }

                row = [];
            } else {
                cell += char;
            }
        }

        if (cell.length > 0 || row.length > 0) {
            row.push(cell.trim());

            if (row.some(value => String(value).trim() !== '')) {
                rows.push(row);
            }
        }

        return rows;
    }

    function cleanCell(value) {
        return String(value ?? '')
            .replace(/^\uFEFF/, '')
            .replace(/[\u200B-\u200D\u2060]/g, '')
            .trim();
    }

    function normalizeHeader(value) {
        return normalizeArabic(cleanCell(value))
            .replace(/[^\u0600-\u06FFa-z0-9]+/gi, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function findColumnIndex(headers, preferredNames) {
        const normalizedHeaders = headers.map(normalizeHeader);
        const normalizedPreferred = preferredNames.map(normalizeHeader);

        // الأول: تطابق كامل
        for (const wanted of normalizedPreferred) {
            const index = normalizedHeaders.findIndex(header => header === wanted);
            if (index !== -1) return index;
        }

        // الثاني: تطابق جزئي لو اسم العمود أطول
        for (const wanted of normalizedPreferred) {
            const index = normalizedHeaders.findIndex(header => header.includes(wanted));
            if (index !== -1) return index;
        }

        return -1;
    }

    let dataStatus = 'loading';
    let dataLoadedOnce = false;
    let loadRequestNumber = 0;
    let hideStatusTimer = null;
    let activeLoadController = null;

    async function loadData() {
        const requestNumber = ++loadRequestNumber;

        if (hideStatusTimer) {
            clearTimeout(hideStatusTimer);
            hideStatusTimer = null;
        }

        // لو المستخدم ضغط تحديث أثناء طلب قديم، نلغي الطلب القديم
        if (activeLoadController) {
            activeLoadController.abort();
        }

        activeLoadController = new AbortController();
        const controller = activeLoadController;

        // Timeout حتى لا يظل الموقع معلقاً لو الاتصال توقف
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        dataStatus = 'loading';
        refreshBtn.disabled = true;
        loadingMsg.style.display = 'block';
        loadingMsg.innerText = dataLoadedOnce
            ? 'جاري تحديث بيانات المرضى من الشيت... ⏳'
            : 'جاري تحميل بيانات المرضى من الشيت... ⏳';
        loadingMsg.style.color = '#2563eb';

        try {
            const separator = CSV_URL.includes('?') ? '&' : '?';
            const freshUrl =
                CSV_URL +
                separator +
                'cachebust=' +
                Date.now() +
                '-' +
                requestNumber;

            const response = await fetch(freshUrl, {
                method: 'GET',
                cache: 'no-store',
                credentials: 'omit',
                signal: controller.signal
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const csvText = await response.text();

            if (!csvText || !csvText.trim()) {
                throw new Error('Empty CSV response');
            }

            const rows = parseCSV(csvText);

            if (rows.length < 2) {
                throw new Error('No patient rows found');
            }

            const headers = rows[0].map(cleanCell);

            /*
               نبحث بأسماء واضحة أولاً حتى لا نلتقط عموداً خاطئاً
               لو كان هناك أكثر من عمود يحتوي على كلمة "اسم" أو "طبي".
            */
            const colName = findColumnIndex(headers, [
                'اسم المريض',
                'اسم المريض رباعي',
                'المريض',
                'الاسم'
            ]);

            const colUnified = findColumnIndex(headers, [
                'رقم موحد',
                'الرقم الموحد',
                'الرقم الطبي',
                'رقم طبي',
                'رقم المريض',
                'موحد'
            ]);

            if (colName === -1) {
                throw new Error(
                    'لم يتم العثور على عمود اسم المريض. الأعمدة الموجودة: ' +
                    headers.join(' | ')
                );
            }

            const newPatientsList = [];

            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                const patientName = cleanCell(cols[colName]);

                if (!patientName) continue;

                newPatientsList.push({
                    name: patientName,
                    unifiedId:
                        colUnified !== -1
                            ? cleanCell(cols[colUnified])
                            : ''
                });
            }

            if (newPatientsList.length === 0) {
                throw new Error('لم يتم العثور على مرضى صالحين داخل الشيت');
            }

            // نتأكد أن هذه هي أحدث عملية تحميل قبل استبدال البيانات
            if (requestNumber !== loadRequestNumber) return;

            patientsList = newPatientsList;
            dataStatus = 'ready';
            dataLoadedOnce = true;

            /*
               لو فيه مريض مختار حالياً وتم تعديل بياناته في الشيت،
               نحدّث الاستيكر تلقائياً بشرط أن يكون الاسم فريداً.
            */
            if (selectedPatient) {
                const sameNamePatients = patientsList.filter(
                    patient =>
                        normalizeArabic(patient.name) ===
                        normalizeArabic(selectedPatient.name)
                );

                if (sameNamePatients.length === 1) {
                    selectedPatient = sameNamePatients[0];
                    stName.innerText = selectedPatient.name || '---';
                    stUnifiedId.innerText = selectedPatient.unifiedId || '---';
                }
            }

            // نقفل أي اقتراحات قديمة حتى البحث التالي يستخدم البيانات الجديدة
            currentMatches = [];
            activeIndex = -1;
            suggestionsBox.innerHTML = '';
            suggestionsBox.classList.remove('open');

            const now = new Date();
            const updateTime = now.toLocaleTimeString('ar-EG', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            loadingMsg.innerText =
                `✅ تم تحديث ${patientsList.length} مريض — آخر تحديث ${updateTime}`;

            loadingMsg.style.color = '#10b981';

            hideStatusTimer = setTimeout(() => {
                if (dataStatus === 'ready') {
                    loadingMsg.style.display = 'none';
                }
            }, 4000);

        } catch (error) {
            if (requestNumber !== loadRequestNumber) return;

            console.error('Patient sheet loading error:', error);

            /*
               لو سبق تحميل البيانات بنجاح ثم فشل التحديث،
               نحتفظ بالبيانات القديمة بدلاً من مسحها.
            */
            if (patientsList.length > 0 && dataLoadedOnce) {
                dataStatus = 'ready';
                loadingMsg.innerText =
                    `⚠️ تعذر تحديث الشيت — يتم استخدام آخر بيانات محملة (${patientsList.length} مريض)`;
            } else {
                dataStatus = 'error';
                loadingMsg.innerText =
                    '⚠️ تعذر تحميل بيانات المرضى من الشيت. تأكد من الإنترنت ونشر الشيت كـ CSV.';
            }

            loadingMsg.style.color = '#dc2626';

        } finally {
            clearTimeout(timeoutId);

            if (requestNumber === loadRequestNumber) {
                refreshBtn.disabled = false;

                if (activeLoadController === controller) {
                    activeLoadController = null;
                }
            }
        }
    }

    let currentMatches = [];
    let activeIndex = -1;
    let selectedPatient = null;

    function renderActiveHighlight() {
        const items = suggestionsBox.querySelectorAll('.suggestion-item[data-idx]');
        items.forEach(el => el.classList.remove('active'));

        if (activeIndex >= 0 && items[activeIndex]) {
            items[activeIndex].classList.add('active');
            items[activeIndex].scrollIntoView({ block: 'nearest' });
        }
    }

    searchInput.addEventListener('input', (e) => {
        const query = normalizeArabic(e.target.value);
        suggestionsBox.innerHTML = '';
        activeIndex = -1;
        selectedPatient = null;

        if (!query) {
            suggestionsBox.classList.remove('open');
            currentMatches = [];
            return;
        }

        currentMatches = patientsList
            .filter(p => normalizeArabic(p.name).includes(query))
            .slice(0, 10);

        if (currentMatches.length === 0) {
            suggestionsBox.innerHTML = '<div class="suggestion-item" style="color:#94a3b8;">لا يوجد نتائج...</div>';
        } else {
            currentMatches.forEach((patient, idx) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.dataset.idx = idx;
                div.innerText = patient.name;

                div.onmousedown = (ev) => {
                    ev.preventDefault();
                    activeIndex = idx;
                    fillSticker(patient);
                };

                suggestionsBox.appendChild(div);
            });
        }

        suggestionsBox.classList.add('open');
    });

    searchInput.addEventListener('keydown', (e) => {
        if (!suggestionsBox.classList.contains('open') || currentMatches.length === 0) return;

        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIndex = (activeIndex + 1) % currentMatches.length;
            renderActiveHighlight();
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIndex = (activeIndex - 1 + currentMatches.length) % currentMatches.length;
            renderActiveHighlight();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIndex >= 0 && currentMatches[activeIndex]) {
                fillSticker(currentMatches[activeIndex]);
            }
        } else if (e.key === 'Escape') {
            suggestionsBox.classList.remove('open');
        }
    });

    searchInput.addEventListener('blur', () =>
        setTimeout(() => suggestionsBox.classList.remove('open'), 150)
    );

    function fillSticker(patient) {
        selectedPatient = patient;
        searchInput.value = patient.name;
        suggestionsBox.classList.remove('open');
        stName.innerText = patient.name || "---";
        stUnifiedId.innerText = patient.unifiedId || "---";
    }

    function loadLogoImage() {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => {
                const fallback = new Image();
                fallback.onload = () => resolve(fallback);
                fallback.onerror = reject;
                fallback.src = 'TWEAKS/MEpics/sidnawi_thermal_logo.png';
            };
            img.src = 'MEpics/sidnawi_thermal_logo.png';
        });
    }

    function drawTextRTL(ctx, text, x, y, font, maxWidth) {
        ctx.save();
        ctx.direction = 'rtl';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = font;
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 0.35;
        ctx.strokeText(text, x, y, maxWidth);
        ctx.fillText(text, x, y, maxWidth);
        ctx.restore();
    }

    async function createThermalSticker() {
        const canvas = document.createElement('canvas');
        canvas.width = PRINT_WIDTH;
        canvas.height = PRINT_HEIGHT;

        const ctx = canvas.getContext('2d', { alpha: false });

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, PRINT_WIDTH, PRINT_HEIGHT);

        const name = stName.innerText.trim() || '---';
        const unified = stUnifiedId.innerText.trim() || '---';

        try {
            const logo = await loadLogoImage();
            const maxLogoWidth = 90;
            const maxLogoHeight = 32;

            const ratio = Math.min(
                maxLogoWidth / logo.naturalWidth,
                maxLogoHeight / logo.naturalHeight
            );

            const logoWidth = logo.naturalWidth * ratio;
            const logoHeight = logo.naturalHeight * ratio;

            const logoX = 20; 
            const logoY = PRINT_HEIGHT - logoHeight - 15; 

            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(logo, logoX, logoY, logoWidth, logoHeight);
        } catch (error) {
            console.warn('Logo could not be loaded', error);
        }

        let nameText = name;
        let nameFontSize = 45;

        if (nameText.length > 18) nameFontSize = 38;
        if (nameText.length > 28) nameFontSize = 32;
        if (nameText.length > 38) nameFontSize = 26;

        drawTextRTL(
            ctx,
            nameText,
            PRINT_WIDTH / 2,
            58, 
            `900 ${nameFontSize}px Tahoma, Arial, sans-serif`,
            380
        );

        const unifiedText = `رقم موحد: ${unified}`;

        drawTextRTL(
            ctx,
            unifiedText,
            PRINT_WIDTH / 2,
            125, 
            `900 28px Tahoma, Arial, sans-serif`,
            380
        );

        return canvas.toDataURL('image/png');
    }

    async function printStickers() {
        const printContainer = document.getElementById('print-container');

        if (dataStatus === 'loading') {
            const proceed = confirm('⏳ البيانات لسه بتتحمل من الشيت. هل تحب تكمل الطباعة برضه؟');
            if (!proceed) return;
        }

        if (!selectedPatient && stName.innerText.trim() === 'اسم المريض') {
            const proceed = confirm('⚠️ لسه معملتش بحث عن مريض، والاستيكر لسه فاضي. هل تحب تكمل الطباعة؟');
            if (!proceed) return;
        }

        let copies = parseInt(copiesCount.value, 10);
        if (isNaN(copies) || copies < 1) copies = 1;
        if (copies > 50) copies = 50;

        const printButton = document.querySelector('.btn-print');
        const oldButtonText = printButton.innerText;
        printButton.disabled = true;
        printButton.innerText = '⏳ تجهيز الطباعة...';

        try {
            printContainer.innerHTML = '';
            const imageData = await createThermalSticker();

            for (let i = 0; i < copies; i++) {
                const img = document.createElement('img');
                img.className = 'thermal-print-image';
                img.src = imageData;
                img.width = PRINT_WIDTH;
                img.height = PRINT_HEIGHT;
                printContainer.appendChild(img);
            }

            await new Promise(resolve =>
                requestAnimationFrame(() =>
                    requestAnimationFrame(resolve)
                )
            );

            window.print();
        } catch (error) {
            console.error(error);
            alert('حدث خطأ أثناء تجهيز الاستيكر للطباعة.');
        } finally {
            printButton.disabled = false;
            printButton.innerText = oldButtonText;
        }
    }

    loadData();
</script>
