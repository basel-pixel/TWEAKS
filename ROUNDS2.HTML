<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيت مرور الأطباء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الشاشة الأساسية */
        :root {
            color-scheme: light;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px 15px;
            background-color: #eef2f5; 
            color: #000;
        }
        
        #content-to-print {
            background-color: #ffffff;
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            overflow: hidden; 
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .hospital-logo img {
            max-width: 140px;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #0f172a;
            font-weight: 700;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1; 
            flex-wrap: wrap; 
            gap: 10px;
        }
        .header-info > span {
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 14px;
            color: #000;
        }
        .header-info input {
            border: none;
            border-bottom: 1px solid #94a3b8;
            font-family: inherit;
            font-size: 15px;
            background: transparent;
            text-align: center;
            width: 100px;
            margin-right: 5px;
            outline: none;
            color: #000; 
            font-weight: 700;
        }
        
        #input-date {
            background-color: #f1f5f9;
            cursor: not-allowed;
            border-bottom: 1px dashed #64748b;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 750px; 
            border-collapse: collapse;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px 6px;
            text-align: center;
            font-size: 14px;
            color: #000; 
        }
        th {
            background-color: #f8fafc; 
            color: #000;
            font-weight: 700;
        }
        td[contenteditable="true"]:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
            color: #000; 
        }
        
        .table-input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            outline: none;
            padding: 5px;
            margin: 0;
            box-sizing: border-box;
            color: #000; 
            font-weight: 600;
        }
        .table-input:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            background: transparent;
        }
        
        .table-date-input {
            position: relative;
        }

        .btn {
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .print-btn { 
            background: linear-gradient(135deg, #3b82f6, #2563eb); 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .add-btn { 
            background: linear-gradient(135deg, #10b981, #059669); 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-bottom: 15px; 
        }
        .clear-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-bottom: 30px;
        }
        
        /* رسالة التحميل */
        #loading-indicator {
            text-align: center;
            color: #2563eb;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff; margin: 0; padding: 0; font-size: 14px; }
            #content-to-print { 
                padding: 0; 
                border-radius: 0; 
                box-shadow: none; 
                border: none;
                margin: 0;
                overflow: visible; 
            }
            .table-responsive { overflow-x: visible !important; } 
            table { min-width: 100%; }
            .header-info { border-bottom: none; }
            th { background-color: #e2e8f0 !important; color: #000; -webkit-print-color-adjust: exact; }
            th, td { border: 1px solid #000; color: #000 !important; }
            .table-input { font-weight: normal; }
            @page { size: A4 landscape; margin: 1cm; }
        }
    </style>
</head>
<body>
    
    <button class="btn print-btn no-print" onclick="customPrint()">حفظ الشيت 💾</button>

    <div id="content-to-print">
        <div class="hospital-logo">
            <img src="MEpics/Picture1.png" alt="مستشفى صيدناوي">
        </div>

        <h2>شيت مرور الأطباء</h2>

        <div class="header-info">
            <span>التاريخ: <input type="text" id="input-date" readonly></span>
            <span>القسم: <input type="text" id="input-dept" placeholder="اكتب القسم"></span>
            <span>الطبيب: <input type="text" id="input-doc" placeholder="اسم الطبيب"></span>
        </div>
        
        <div id="loading-indicator" class="no-print">جاري سحب أسماء المرضى من قاعدة البيانات... ⏳</div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="5%">م</th>
                        <th width="15%">اسم المريض</th>
                        <th width="12%">تاريخ الدخول</th>
                        <th width="8%">قسم الاقامة</th>
                        <th width="15%">التشخيص</th>
                        <th width="20%">الخطة العلاجية</th>
                        <th width="25%">الملاحظات</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>

    <!-- قائمة المرضى المنسدلة المخفية -->
    <datalist id="patients-list">
    </datalist>

    <button class="btn add-btn no-print" onclick="addRow()">+ إضافة مريض</button>
    <button class="btn clear-btn no-print" onclick="clearData()">مسح البيانات وبدء شيت جديد 🗑️</button>

    <script>
        const tbody = document.getElementById('table-body');
        const deptInput = document.getElementById('input-dept');
        const docInput = document.getElementById('input-doc');
        const dateInput = document.getElementById('input-date');
        const datalist = document.getElementById('patients-list');
        const loadingIndicator = document.getElementById('loading-indicator');

        // رابط الـ API الخاص بجوجل شيت
        const API_URL = "https://script.google.com/macros/s/AKfycbyRAvDWg72VPkBGqO3NrIBcLiewAZ6vB-pj_kdAVWUwOEieKzQBlKW1T9fDMDfAegE/exec";

        // دالة سحب المرضى من الشيت الحقيقي
        async function fetchPatients() {
            try {
                loadingIndicator.style.display = 'block';
                const response = await fetch(API_URL);
                const activePatients = await response.json();
                
                datalist.innerHTML = ''; // تفريغ القائمة القديمة
                
                activePatients.forEach(patient => {
                    const option = document.createElement('option');
                    option.value = patient.name;
                    option.setAttribute('data-date', patient.admissionDate);
                    datalist.appendChild(option);
                });
                
                loadingIndicator.style.display = 'none';
            } catch (error) {
                console.error("خطأ في جلب البيانات: ", error);
                loadingIndicator.innerText = "⚠️ تعذر سحب أسماء المرضى، يرجى التحقق من الاتصال بالإنترنت.";
                loadingIndicator.style.color = "red";
            }
        }

        // تعيين تاريخ اليوم تلقائياً
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const currentDate = `${yyyy}-${mm}-${dd}`;
        dateInput.value = currentDate;

        function addRow(patientData = {}) {
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
                <td>${rowCount}</td>
                <td><input type="text" class="table-input name-input" list="patients-list" placeholder="ابحث أو اكتب..." value="${patientData.name || ''}"></td>
                <td><input type="date" class="table-input table-date-input" value="${patientData.date || ''}"></td>
                <td contenteditable="true">${patientData.residence || ''}</td>
                <td contenteditable="true">${patientData.diag || ''}</td>
                <td contenteditable="true">${patientData.plan || ''}</td>
                <td contenteditable="true">${patientData.notes || ''}</td>
            `;
            
            const nameInput = tr.querySelector('.name-input');
            const dateCell = tr.querySelector('.table-date-input');

            // حدث يراقب تغيير الاسم لجلب تاريخ الدخول أوتوماتيكياً
            nameInput.addEventListener('input', function(e) {
                const selectedName = e.target.value;
                const options = datalist.options;
                for (let i = 0; i < options.length; i++) {
                    if (options[i].value === selectedName) {
                        dateCell.value = options[i].getAttribute('data-date');
                        break;
                    }
                }
                saveToLocalStorage();
            });

            tr.querySelectorAll('input, td[contenteditable="true"]').forEach(element => {
                element.addEventListener('input', saveToLocalStorage);
            });

            tbody.appendChild(tr);
        }

        function saveToLocalStorage() {
            const data = {
                dept: deptInput.value,
                doc: docInput.value,
                rows: []
            };

            Array.from(tbody.rows).forEach(tr => {
                data.rows.push({
                    name: tr.querySelector('.name-input').value.trim(),
                    date: tr.querySelector('.table-date-input').value,
                    residence: tr.cells[3].innerText.trim(),
                    diag: tr.cells[4].innerText.trim(),
                    plan: tr.cells[5].innerText.trim(),
                    notes: tr.cells[6].innerText.trim()
                });
            });

            localStorage.setItem('sidnawi_round_data', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('sidnawi_round_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                deptInput.value = data.dept || '';
                docInput.value = data.doc || '';
                
                if (data.rows && data.rows.length > 0) {
                    data.rows.forEach(rowData => addRow(rowData));
                    return;
                }
            }
            
            for (let i = 1; i <= 15; i++) {
                addRow();
            }
        }

        function clearData() {
            if (confirm('هل أنت متأكد من مسح جميع بيانات الشيت الحالي وبدء شيت جديد؟')) {
                localStorage.removeItem('sidnawi_round_data');
                location.reload();
            }
        }

        deptInput.addEventListener('input', saveToLocalStorage);
        docInput.addEventListener('input', saveToLocalStorage);

        // تشغيل الدوال عند فتح الصفحة
        fetchPatients(); // سحب المرضى من جوجل شيت
        loadFromLocalStorage(); // تحميل البيانات المحفوظة

        function customPrint() {
            const deptName = deptInput.value.trim() ? deptInput.value.trim() : "عام";
            const currentHour = new Date().getHours();
            const shiftType = currentHour >= 14 ? "مسائي" : "صباحي";
            
            document.title = `شيت_مرور_${deptName}_${shiftType}_${currentDate}`;
            window.print();
        }
    </script>
</body>
</html>
