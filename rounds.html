<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيت مرور الاطباء </title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الشاشة الأساسية */
        :root {
            color-scheme: light;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 20px 15px;
            background-color: #eef2f5; 
            color: #000;
        }
        
        #content-to-print {
            background-color: #ffffff;
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            overflow: hidden; 
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .hospital-logo img {
            max-width: 140px;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #0f172a;
            font-weight: 700;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1; 
            flex-wrap: wrap; 
            gap: 10px;
        }
        .header-info > span {
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 14px;
            color: #000;
        }
        .header-info input {
            border: none;
            border-bottom: 1px solid #94a3b8;
            font-family: inherit;
            font-size: 15px;
            background: transparent;
            text-align: center;
            width: 100px;
            margin-right: 5px;
            outline: none;
            color: #000; 
            font-weight: 700;
        }
        
        #input-date {
            background-color: #f1f5f9;
            cursor: not-allowed;
            border-bottom: 1px dashed #64748b;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 750px; 
            border-collapse: collapse;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px 6px;
            text-align: center;
            font-size: 14px;
            color: #000; 
        }
        th {
            background-color: #f8fafc; 
            color: #000;
            font-weight: 700;
        }
        td[contenteditable="true"]:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
            color: #000; 
        }
        
        .table-date-input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            outline: none;
            padding: 0;
            margin: 0;
            position: relative;
            appearance: none;
            -webkit-appearance: none;
            font-weight: 600;
            color: #000; 
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            background: transparent;
        }

        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-clear-button {
            display: none;
            -webkit-appearance: none;
        }

        .btn {
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .print-btn { 
            background: linear-gradient(135deg, #3b82f6, #2563eb); 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .add-btn { 
            background: linear-gradient(135deg, #10b981, #059669); 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-bottom: 15px; 
        }
        .clear-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-bottom: 30px;
        }
        
        /* إعدادات الطباعة */
        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff; margin: 0; padding: 0; font-size: 14px; }
            #content-to-print { 
                padding: 0; 
                border-radius: 0; 
                box-shadow: none; 
                border: none;
                margin: 0;
                overflow: visible; 
            }
            .table-responsive { overflow-x: visible !important; } 
            table { min-width: 100%; }
            .header-info { border-bottom: none; }
            th { background-color: #e2e8f0 !important; color: #000; -webkit-print-color-adjust: exact; }
            th, td { border: 1px solid #000; color: #000 !important; }
            @page { size: A4 landscape; margin: 1cm; }
        }
    </style>
</head>
<body>
    
    <button class="btn print-btn no-print" onclick="customPrint()">حفظ الشيت 💾</button>

    <div id="content-to-print">
        <div class="hospital-logo">
            <img src="MEpics/Picture1.png" alt="مستشفى صيدناوي">
        </div>

        <h2>شيت مرور الأطباء</h2>

        <div class="header-info">
            <span>التاريخ: <input type="text" id="input-date" readonly></span>
            <span>القسم: <input type="text" id="input-dept" placeholder="اكتب القسم"></span>
            <span>الطبيب: <input type="text" id="input-doc" placeholder="اسم الطبيب"></span>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="5%">م</th>
                        <th width="15%">اسم المريض</th>
                        <th width="12%">تاريخ الدخول</th>
                        <th width="8%">قسم الاقامة</th>
                        <th width="15%">التشخيص</th>
                        <th width="20%">الخطة العلاجية</th>
                        <th width="25%">الملاحظات</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>

    <button class="btn add-btn no-print" onclick="addRow()">+ إضافة مريض</button>
    <button class="btn clear-btn no-print" onclick="clearData()">مسح البيانات وبدء شيت جديد 🗑️</button>

    <script>
        const tbody = document.getElementById('table-body');
        const deptInput = document.getElementById('input-dept');
        const docInput = document.getElementById('input-doc');
        const dateInput = document.getElementById('input-date');

        // تعيين تاريخ اليوم تلقائياً
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const currentDate = `${yyyy}-${mm}-${dd}`;
        dateInput.value = currentDate;

        function addRow(patientData = {}) {
            const rowCount = tbody.rows.length + 1;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${rowCount}</td>
                <td contenteditable="true">${patientData.name || ''}</td>
                <td><input type="date" class="table-date-input" value="${patientData.date || ''}"></td>
                <td contenteditable="true">${patientData.residence || ''}</td>
                <td contenteditable="true">${patientData.diag || ''}</td>
                <td contenteditable="true">${patientData.plan || ''}</td>
                <td contenteditable="true">${patientData.notes || ''}</td>
            `;
            
            // إضافة مستمع لحفظ البيانات فور الكتابة في أي خانة بالصف
            tr.querySelectorAll('input, td[contenteditable="true"]').forEach(element => {
                element.addEventListener('input', saveToLocalStorage);
            });

            tbody.appendChild(tr);
        }

        // حفظ البيانات في ذاكرة المتصفح المحلية
        function saveToLocalStorage() {
            const data = {
                dept: deptInput.value,
                doc: docInput.value,
                rows: []
            };

            Array.from(tbody.rows).forEach(tr => {
                const cells = tr.cells;
                data.rows.push({
                    name: cells[1].innerText.trim(),
                    date: cells[2].querySelector('input').value,
                    residence: cells[3].innerText.trim(),
                    diag: cells[4].innerText.trim(),
                    plan: cells[5].innerText.trim(),
                    notes: cells[6].innerText.trim()
                });
            });

            localStorage.setItem('sidnawi_round_data', JSON.stringify(data));
        }

        // استرجاع البيانات المحفوظة عند فتح الصفحة
        function loadFromLocalStorage() {
            const savedData = localStorage.getItem('sidnawi_round_data');
            if (savedData) {
                const data = JSON.parse(savedData);
                deptInput.value = data.dept || '';
                docInput.value = data.doc || '';
                
                if (data.rows && data.rows.length > 0) {
                    data.rows.forEach(rowData => addRow(rowData));
                    return;
                }
            }
            
            // لو مفيش بيانات محفوظة، افتح 15 صف فاضي كبداية
            for (let i = 1; i <= 15; i++) {
                addRow();
            }
        }

        // زر لمسح الشيت والبدء من جديد
        function clearData() {
            if (confirm('هل أنت متأكد من مسح جميع بيانات الشيت الحالي وبدء شيت جديد؟')) {
                localStorage.removeItem('sidnawi_round_data');
                location.reload();
            }
        }

        // الاستماع لتغييرات حقول القسم والطبيب للحفظ الفوري
        deptInput.addEventListener('input', saveToLocalStorage);
        docInput.addEventListener('input', saveToLocalStorage);

        // تشغيل دالة التحميل عند فتح الصفحة
        loadFromLocalStorage();

        // دالة مخصصة لضبط اسم ملف الـ PDF بناءً على القسم والتاريخ
        function customPrint() {
            const deptName = deptInput.value.trim() ? deptInput.value.trim() : "عام";
            document.title = `شيت_مرور_${deptName}_${currentDate}`;
            window.print();
        }
    </script>
</body>
</html>
