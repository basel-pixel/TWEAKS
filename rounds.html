<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>شيت مرور الأطباء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px 15px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            background-color: #eef2f5;
            color: #000;
        }

        #content-to-print {
            background-color: #ffffff;
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .hospital-logo img {
            max-width: 140px;
            max-height: 100%;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #0f172a;
            font-weight: 700;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-info > span {
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 14px;
            color: #000;
        }
        .header-info input {
            border: none;
            border-bottom: 1px solid #94a3b8;
            font-family: inherit;
            font-size: 15px;
            background: transparent;
            text-align: center;
            width: 100px;
            margin-right: 5px;
            outline: none;
            color: #000;
            font-weight: 700;
        }

        #input-date {
            background-color: #f1f5f9;
            cursor: not-allowed;
            border-bottom: 1px dashed #64748b;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 10px 6px;
            text-align: center;
            font-size: 14px;
            color: #000;
        }
        th {
            background-color: #f8fafc;
            color: #000;
            font-weight: 700;
        }
        td[contenteditable="true"]:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
            color: #000;
        }

        .table-input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            outline: none;
            padding: 5px;
            margin: 0;
            box-sizing: border-box;
            color: #000;
            font-weight: 600;
        }
        .table-input:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
        }

        /* لم نعد نغطي كامل الخانة بأيقونة التقويم، حتى يقدر الطبيب يكتب التاريخ يدوياً
           ويفتح التقويم من الأيقونة الافتراضية فقط */
        .table-date-input {
            position: relative;
        }

        /* قائمة اقتراحات أسماء المرضى (بديل مخصص عن datalist لأنه مش مدعوم كويس في Safari/آيفون) */
        .name-cell-wrapper {
            position: relative;
        }
        .suggestions-box {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            z-index: 50;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            max-height: 220px;
            overflow-y: auto;
            text-align: right;
        }
        .suggestions-box.open {
            display: block;
        }
        .suggestion-item {
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item .sugg-date {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #64748b;
            margin-top: 2px;
        }
        .suggestion-item:hover,
        .suggestion-item.active {
            background-color: #eff6ff;
        }
        .suggestion-empty {
            padding: 10px 12px;
            font-size: 13px;
            color: #94a3b8;
        }

        .debug-toggle-btn {
            display: block;
            margin: 0 auto 15px;
            background: transparent;
            border: 1px dashed #94a3b8;
            color: #475569;
            font-family: inherit;
            font-size: 12px;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .debug-box {
            display: none;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 320px;
            overflow-y: auto;
        }
        .debug-box.open {
            display: block;
        }

        .delete-row-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1;
        }
        .delete-row-btn:hover {
            background-color: #fee2e2;
        }
        .delete-row-btn:active {
            transform: scale(0.92);
        }

        .btn {
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .print-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .cloud-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
        }
        .cloud-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        .add-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-bottom: 15px;
        }
        .clear-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-bottom: 30px;
        }

        #loading-indicator {
            text-align: center;
            color: #2563eb;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            min-height: 18px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff; margin: 0; padding: 0; font-size: 14px; }
            #content-to-print {
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                border: none;
                margin: 0;
                overflow: visible;
            }
            .table-responsive { overflow-x: visible !important; }
            table { min-width: 100%; }
            .header-info { border-bottom: none; }
            th { background-color: #e2e8f0 !important; color: #000; -webkit-print-color-adjust: exact; }
            th, td { border: 1px solid #000; color: #000 !important; }
            .table-input { font-weight: normal; }
            @page { size: A4 landscape; margin: 1cm; }
        }
    </style>
</head>

        <h2>شيت مرور الأطباء</h2>

        <div class="header-info">
            <span>التاريخ: <input type="text" id="input-date" readonly></span>
            <span>القسم: <input type="text" id="input-dept" placeholder="اكتب القسم"></span>
            <span>الطبيب: <input type="text" id="input-doc" placeholder="اسم الطبيب"></span>
        </div>

        <div id="loading-indicator" class="no-print"></div>
        <div id="patients-count" class="no-print" style="text-align:center; font-size:12px; color:#64748b; margin-bottom:8px;"></div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="5%">م</th>
                        <th width="15%">اسم المريض</th>
                        <th width="12%">تاريخ الدخول</th>
                        <th width="8%">قسم الاقامة</th>
                        <th width="15%">التشخيص</th>
                        <th width="18%">الخطة العلاجية</th>
                        <th width="22%">الملاحظات</th>
                        <th width="5%" class="no-print"></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>

    <button class="debug-toggle-btn no-print" onclick="toggleDebug()">🔍 عرض بيانات المرضى الخام (تشخيص)</button>
    <pre id="debug-box" class="debug-box no-print"></pre>

    <button class="btn add-btn no-print" onclick="addRow()">+ إضافة مريض</button>
    <button class="btn clear-btn no-print" onclick="clearData()">مسح البيانات وبدء شيت جديد 🗑️</button>

    <script>
        const tbody = document.getElementById('table-body');
        const deptInput = document.getElementById('input-dept');
        const docInput = document.getElementById('input-doc');
        const dateInput = document.getElementById('input-date');
        const loadingIndicator = document.getElementById('loading-indicator');
        const patientsCountEl = document.getElementById('patients-count');
        const originalTitle = document.title;

        // بيانات المرضى في الذاكرة (بديل عن datalist)
        let patientsData = [];
        let lastRawResponse = null; // آخر رد خام راجع من الـ API، لعرضه في صندوق التشخيص

        function toggleDebug() {
            const box = document.getElementById('debug-box');
            if (box.classList.contains('open')) {
                box.classList.remove('open');
                return;
            }
            let text;
            if (lastRawResponse === null) {
                text = 'لسه مفيش رد من الـ API اتحفظ. جرب اعمل تحديث للصفحة وانتظر شوية.';
            } else {
                try {
                    text = JSON.stringify(lastRawResponse, null, 2);
                } catch (e) {
                    text = String(lastRawResponse);
                }
            }
            box.textContent = text;
            box.classList.add('open');
        }

        // نحاول نقرأ اسم/تاريخ المريض من أي شكل مفاتيح محتمل يرجعه الـ API
        function extractName(patient) {
            return (patient.name || patient.Name || patient.patientName
                || patient['الاسم'] || patient['اسم المريض'] || '').toString().trim();
        }
        function extractAdmissionDate(patient) {
            return (patient.admissionDate || patient.AdmissionDate || patient.admission_date
                || patient.date || patient['تاريخ الدخول'] || patient['التاريخ'] || '').toString().trim();
        }

        // رابط الـ API الخاص بجوجل شيت
        // ملحوظة: أي رابط في كود الواجهة الأمامية يفضل ظاهر لأي حد يفتح "عرض المصدر"،
        // فمن الأفضل مستقبلاً إضافة تحقق/مفتاح على مستوى الـ Apps Script نفسه لو البيانات حساسة.
        const API_URL = "https://script.google.com/macros/s/AKfycbyRAvDWg72VPkBGqO3NrIBcLiewAZ6vB-pj_kdAVWUwOEieKzQBlKW1T9fDMDfAegE/exec";

        function safeGetLocal(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) {
                console.error('localStorage غير متاح للقراءة:', e);
                return null;
            }
        }

        function safeSetLocal(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.error('تعذر الحفظ في localStorage:', e);
            }
        }

        function safeRemoveLocal(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) {
                console.error('تعذر حذف localStorage:', e);
            }
        }

        // دالة سحب المرضى (النسخة السريعة بالكاش)
        async function fetchPatients() {
            const cachedPatients = safeGetLocal('sidnawi_patients_cache');
            let cachedParsed = null;
            if (cachedPatients) {
                try {
                    cachedParsed = JSON.parse(cachedPatients);
                    lastRawResponse = cachedParsed;
                    setPatientsData(cachedParsed);
                } catch (e) {
                    cachedParsed = null;
                }
            }
            if (!cachedParsed) {
                loadingIndicator.style.color = '#2563eb';
                loadingIndicator.innerText = 'جاري سحب أسماء المرضى من قاعدة البيانات... ⏳';
            }

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('استجابة غير سليمة من الخادم (كود ' + response.status + ')');
                const activePatients = await response.json();

                lastRawResponse = activePatients;
                safeSetLocal('sidnawi_patients_cache', JSON.stringify(activePatients));
                setPatientsData(activePatients);
                loadingIndicator.innerText = '';
            } catch (error) {
                console.error("خطأ في جلب البيانات: ", error);
                if (!cachedParsed) {
                    loadingIndicator.innerText = "⚠️ تعذر سحب أسماء المرضى، يرجى التحقق من الاتصال بالإنترنت.";
                    loadingIndicator.style.color = "red";
                } else {
                    loadingIndicator.innerText = "⚠️ تعذر تحديث قائمة المرضى، هتشتغل بآخر نسخة محفوظة.";
                    loadingIndicator.style.color = "#b45309";
                }
            }
        }

        // حفظ بيانات المرضى في الذاكرة + إظهار عددهم للتأكد إنهم اتحملوا فعلاً
        function setPatientsData(patientsArray) {
            patientsData = Array.isArray(patientsArray)
                ? patientsArray.filter(p => p && extractName(p))
                : [];

            if (!Array.isArray(patientsArray)) {
                patientsCountEl.innerText = '⚠️ الرد من قاعدة البيانات مش بالشكل المتوقع (مش قائمة مرضى).';
                patientsCountEl.style.color = '#dc2626';
            } else if (patientsData.length === 0) {
                patientsCountEl.innerText = '⚠️ لم يتم العثور على أسماء مرضى — تأكد من صلاحيات/بيانات الـ API.';
                patientsCountEl.style.color = '#dc2626';
            } else {
                patientsCountEl.innerText = `✅ تم تحميل ${patientsData.length} مريض من قاعدة البيانات`;
                patientsCountEl.style.color = '#16a34a';
            }
        }

        // تحويل أي شكل تاريخ راجع من الـ API لشكل YYYY-MM-DD اللي يقبله input[type=date]
        function parseDateToInputValue(rawDate) {
            if (!rawDate) return '';
            const str = String(rawDate).trim();
            if (!str) return '';

            // شكل ISO: YYYY-MM-DD (زي اللي جوجل سكريبت بيرجعه أحياناً لو التاريخ Date object)
            let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) {
                return `${m[1]}-${m[2]}-${m[3]}`;
            }

            // شكل الشيت المصري: يوم/شهر/سنة أو يوم-شهر-سنة (زي 15/09/2026)
            // مهم: نقرأه كـ يوم/شهر مش شهر/يوم، عشان متضربش التاريخ زي المتصفح بيعمل لو سبناه يخمن
            m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (m) {
                const day = m[1].padStart(2, '0');
                const month = m[2].padStart(2, '0');
                const year = m[3];
                return `${year}-${month}-${day}`;
            }

            // أي شكل تاني نسيب المتصفح يحاول يفهمه (زي "Sep 15 2026")
            const parsed = new Date(str);
            if (!isNaN(parsed.getTime())) {
                const yyyy = parsed.getFullYear();
                const mm = String(parsed.getMonth() + 1).padStart(2, '0');
                const dd = String(parsed.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }
            return '';
        }

        // تعيين تاريخ اليوم تلقائياً
        const today = new Date();
        const yyyy0 = today.getFullYear();
        const mm0 = String(today.getMonth() + 1).padStart(2, '0');
        const dd0 = String(today.getDate()).padStart(2, '0');
        const currentDate = `${yyyy0}-${mm0}-${dd0}`;
        dateInput.value = currentDate;

        function renumberRows() {
            Array.from(tbody.rows).forEach((tr, idx) => {
                const numCell = tr.querySelector('.row-num');
                if (numCell) numCell.textContent = idx + 1;
            });
        }

        function addRow(patientData = {}) {
            const tr = document.createElement('tr');

            // عمود الرقم
            const tdNum = document.createElement('td');
            tdNum.className = 'row-num';
            tr.appendChild(tdNum);

            // عمود اسم المريض + قائمة اقتراحات مخصصة (بديل datalist)
            const tdName = document.createElement('td');
            const nameWrapper = document.createElement('div');
            nameWrapper.className = 'name-cell-wrapper';

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'table-input name-input';
            nameInput.setAttribute('autocomplete', 'off');
            nameInput.placeholder = 'ابحث أو اكتب...';
            nameInput.value = patientData.name || '';

            const suggestionsBox = document.createElement('div');
            suggestionsBox.className = 'suggestions-box';

            nameWrapper.appendChild(nameInput);
            nameWrapper.appendChild(suggestionsBox);
            tdName.appendChild(nameWrapper);
            tr.appendChild(tdName);

            // عمود تاريخ الدخول
            const tdDate = document.createElement('td');
            const dateCell = document.createElement('input');
            dateCell.type = 'date';
            dateCell.className = 'table-input table-date-input';
            dateCell.value = patientData.date || '';
            tdDate.appendChild(dateCell);
            tr.appendChild(tdDate);

            // الأعمدة النصية القابلة للتعديل مباشرة
            const editableFields = [
                { key: 'residence' },
                { key: 'diag' },
                { key: 'plan' },
                { key: 'notes' }
            ];
            const editableCells = {};
            editableFields.forEach(field => {
                const td = document.createElement('td');
                td.setAttribute('contenteditable', 'true');
                td.textContent = patientData[field.key] || '';
                tr.appendChild(td);
                editableCells[field.key] = td;
            });

            // عمود الحذف
            const tdDel = document.createElement('td');
            tdDel.className = 'no-print';
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'delete-row-btn';
            delBtn.textContent = '🗑️';
            delBtn.title = 'حذف هذا الصف';
            delBtn.addEventListener('click', function () {
                if (confirm('حذف هذا المريض من الشيت؟')) {
                    tr.remove();
                    renumberRows();
                    saveToLocalStorage();
                }
            });
            tdDel.appendChild(delBtn);
            tr.appendChild(tdDel);

            // تطبيق اختيار مريض: بيملأ الاسم والتاريخ ويقفل قائمة الاقتراحات
            function applyPatientSelection(patient) {
                nameInput.value = extractName(patient);
                const parsedDate = parseDateToInputValue(extractAdmissionDate(patient));
                dateCell.value = parsedDate;
                closeSuggestions();
                saveToLocalStorage();

                if (!parsedDate) {
                    dateCell.style.outline = '2px solid #f59e0b';
                    dateCell.title = 'لا يوجد تاريخ دخول مسجل لهذا المريض — من فضلك اكتبه يدوياً';
                    dateCell.focus();
                    setTimeout(() => { dateCell.style.outline = ''; }, 3000);
                }
            }

            function closeSuggestions() {
                suggestionsBox.classList.remove('open');
                suggestionsBox.innerHTML = '';
            }

            function renderSuggestions(query) {
                suggestionsBox.innerHTML = '';
                const q = query.trim();

                if (!q) {
                    closeSuggestions();
                    return;
                }

                const matches = patientsData.filter(p =>
                    extractName(p).includes(q)
                ).slice(0, 8);

                if (matches.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'suggestion-empty';
                    empty.textContent = patientsData.length === 0
                        ? 'لم يتم تحميل قائمة مرضى بعد'
                        : 'لا يوجد مريض بهذا الاسم';
                    suggestionsBox.appendChild(empty);
                    suggestionsBox.classList.add('open');
                    return;
                }

                matches.forEach(patient => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';

                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = extractName(patient);
                    item.appendChild(nameSpan);

                    const rawDate = extractAdmissionDate(patient);
                    const dateSpan = document.createElement('span');
                    dateSpan.className = 'sugg-date';
                    if (rawDate && parseDateToInputValue(rawDate)) {
                        dateSpan.textContent = 'تاريخ الدخول: ' + parseDateToInputValue(rawDate);
                    } else {
                        dateSpan.textContent = '⚠️ لا يوجد تاريخ دخول مسجل لهذا المريض — من فضلك اكتبه يدوياً';
                        dateSpan.style.color = '#b45309';
                    }
                    item.appendChild(dateSpan);

                    // نستخدم mousedown/touchstart بدل click عشان نمنع الـ blur
                    // من يقفل القائمة قبل ما نقدر نقرأ الاختيار (مشكلة شائعة على الموبايل)
                    item.addEventListener('mousedown', function (ev) {
                        ev.preventDefault();
                        applyPatientSelection(patient);
                    });
                    item.addEventListener('touchstart', function (ev) {
                        ev.preventDefault();
                        applyPatientSelection(patient);
                    }, { passive: false });

                    suggestionsBox.appendChild(item);
                });

                suggestionsBox.classList.add('open');
            }

            nameInput.addEventListener('input', function (e) {
                renderSuggestions(e.target.value);

                // لو الاسم اتكتب بالظبط ومطابق لمريض معروف (حتى لو من غير ما يضغط من القائمة)
                const exact = patientsData.find(p => extractName(p) === e.target.value.trim());
                if (exact) {
                    dateCell.value = parseDateToInputValue(extractAdmissionDate(exact));
                }
                saveToLocalStorage();
            });

            nameInput.addEventListener('focus', function (e) {
                if (e.target.value.trim()) {
                    renderSuggestions(e.target.value);
                }
            });

            nameInput.addEventListener('blur', function () {
                // تأخير بسيط عشان نضمن إن حدث mousedown/touchstart على الاقتراح يتنفذ الأول
                setTimeout(closeSuggestions, 150);
            });

            [dateCell, ...Object.values(editableCells)].forEach(el => {
                el.addEventListener('input', saveToLocalStorage);
            });

            tbody.appendChild(tr);
            renumberRows();
        }

        function saveToLocalStorage() {
            const data = {
                dept: deptInput.value,
                doc: docInput.value,
                rows: []
            };

            Array.from(tbody.rows).forEach(tr => {
                data.rows.push({
                    name: tr.querySelector('.name-input').value.trim(),
                    date: tr.querySelector('.table-date-input').value,
                    residence: tr.cells[3].innerText.trim(),
                    diag: tr.cells[4].innerText.trim(),
                    plan: tr.cells[5].innerText.trim(),
                    notes: tr.cells[6].innerText.trim()
                });
            });

            safeSetLocal('sidnawi_round_data', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const savedData = safeGetLocal('sidnawi_round_data');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    deptInput.value = data.dept || '';
                    docInput.value = data.doc || '';

                    if (data.rows && data.rows.length > 0) {
                        data.rows.forEach(rowData => addRow(rowData));
                        return;
                    }
                } catch (e) {
                    console.error('تعذرت قراءة البيانات المحفوظة:', e);
                }
            }

            for (let i = 1; i <= 15; i++) {
                addRow();
            }
        }

        // إرسال بيانات المرور الحالية لقاعدة البيانات (doPost في Google Apps Script)
        // بترجع true لو الحفظ نجح، و false لو فشل
        async function saveToCloud() {
            const btn = document.getElementById('cloud-save-btn');

            const rows = Array.from(tbody.rows).map(tr => ({
                name: tr.querySelector('.name-input').value.trim(),
                admissionDate: tr.querySelector('.table-date-input').value,
                residence: tr.cells[3].innerText.trim(),
                diag: tr.cells[4].innerText.trim(),
                plan: tr.cells[5].innerText.trim(),
                notes: tr.cells[6].innerText.trim()
            })).filter(row => row.name !== '');

            if (rows.length === 0) {
                alert('لا يوجد بيانات مرضى لحفظها. من فضلك أضف مريض واحد على الأقل قبل الحفظ.');
                return false;
            }

            const currentHour = new Date().getHours();
            const shiftType = currentHour >= 14 ? 'مسائي' : 'صباحي';

            const payload = {
                date: dateInput.value,
                shift: shiftType,
                dept: deptInput.value.trim() || 'عام',
                doc: docInput.value.trim() || 'غير مسجل',
                rows: rows
            };

            try {
                // نستخدم text/plain عشان نتفادى مشكلة الـ CORS preflight
                // اللي بتحصل مع Google Apps Script لو استخدمنا application/json مباشرة
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('استجابة غير سليمة من الخادم (كود ' + response.status + ')');
                }

                const result = await response.json();
                if (result.status === 'success') {
                    return true;
                }
                throw new Error(result.message || 'خطأ غير معروف من الخادم');
            } catch (error) {
                console.error('خطأ أثناء الحفظ في قاعدة البيانات: ', error);
                alert('⚠️ حصل خطأ أثناء حفظ البيانات في قاعدة البيانات:\n' + error.message + '\n\nهيتم فتح الطباعة عادي، بس تأكد إنك تحفظ لاحقاً يدوياً لو الاتصال رجع.');
                return false;
            }
        }

        // زرار واحد: يحاول يحفظ في قاعدة البيانات، وفي كل الحالات (نجح الحفظ أو فشل) يفتح الطباعة
        async function saveAndPrint() {
            const btn = document.getElementById('cloud-save-btn');
            const originalText = btn.textContent;

            btn.disabled = true;
            btn.textContent = 'جاري الحفظ... ⏳';

            const saved = await saveToCloud();

            btn.textContent = saved ? '✅ تم الحفظ، جاري فتح الطباعة...' : '⚠️ فشل الحفظ، جاري فتح الطباعة...';
            customPrint();

            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 1500);
        }

        function clearData() {
            if (confirm('هل أنت متأكد من مسح جميع بيانات الشيت الحالي وبدء شيت جديد؟')) {
                safeRemoveLocal('sidnawi_round_data');
                location.reload();
            }
        }

        deptInput.addEventListener('input', saveToLocalStorage);
        docInput.addEventListener('input', saveToLocalStorage);

        fetchPatients();
        loadFromLocalStorage();

        function customPrint() {
            const deptName = deptInput.value.trim() ? deptInput.value.trim() : "عام";
            const currentHour = new Date().getHours();
            const shiftType = currentHour >= 14 ? "مسائي" : "صباحي";

            document.title = `شيت_مرور_${deptName}_${shiftType}_${currentDate}`;

            function restoreTitle() {
                document.title = originalTitle;
                window.removeEventListener('afterprint', restoreTitle);
            }
            window.addEventListener('afterprint', restoreTitle);

            window.print();
        }
    </script>
</body>
