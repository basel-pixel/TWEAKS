<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>شيت مرور الأطباء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px 15px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            background-color: #eef2f5;
            color: #000;
        }

        #content-to-print {
            background-color: #ffffff;
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .hospital-logo {
            text-align: center;
            margin-bottom: 15px;
        }
        .hospital-logo img {
            max-width: 140px;
            max-height: 100%;
            height: auto;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #0f172a;
            font-weight: 700;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: 600;
            padding-bottom: 15px;
            border-bottom: 2px dashed #cbd5e1;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-info > span {
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-size: 14px;
            color: #000;
        }
        .header-info input {
            border: none;
            border-bottom: 1px solid #94a3b8;
            font-family: inherit;
            font-size: 15px;
            background: transparent;
            text-align: center;
            width: 100px;
            margin-right: 5px;
            outline: none;
            color: #000;
            font-weight: 700;
        }

        #input-date {
            background-color: #f1f5f9;
            border-bottom: 1px dashed #64748b;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 950px;
            border-collapse: collapse;
            margin-bottom: 10px;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 8px 6px;
            text-align: center;
            font-size: 14px;
            color: #000;
            vertical-align: middle;
        }
        th {
            background-color: #f8fafc;
            color: #000;
            font-weight: 700;
        }

        /* خانات الكتابة المرنة والواسعة للتشخيص والخطط والملاحظات */
        td[contenteditable="true"] {
            min-height: 45px;
            height: auto;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: right;
            padding: 8px;
        }
        td[contenteditable="true"]:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
            color: #000;
        }

        .table-input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            outline: none;
            padding: 5px;
            margin: 0;
            box-sizing: border-box;
            color: #000;
            font-weight: 600;
        }
        .table-input:focus {
            background-color: #eff6ff;
            outline: 2px solid #3b82f6;
            border-radius: 4px;
        }

        /* نظام المقترحات العائمة (Autocomplete) الذكي لأسماء المرضى */
        .name-cell-wrapper {
            position: relative;
            text-align: right;
        }
        .name-input {
            text-align: right !important;
            padding-right: 8px !important;
            font-weight: 700;
        }
        .suggestions-box {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            left: 0;
            z-index: 100;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-height: 240px;
            overflow-y: auto;
            text-align: right;
        }
        .suggestions-box.open {
            display: block;
        }
        .suggestion-item {
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item .sugg-date {
            display: block;
            font-size: 11px;
            font-weight: 400;
            color: #64748b;
            margin-top: 2px;
        }
        .suggestion-item:hover {
            background-color: #eff6ff;
        }
        .suggestion-empty {
            padding: 10px 12px;
            font-size: 13px;
            color: #94a3b8;
        }

        #loading-indicator {
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .delete-row-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1;
        }
        .delete-row-btn:hover {
            background-color: #fee2e2;
        }
        .delete-row-btn:active {
            transform: scale(0.92);
        }

        .btn {
            color: #fff;
            border: none;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 15px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .cloud-btn {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.3);
        }
        .cloud-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }
        .add-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            margin-bottom: 15px;
        }
        .clear-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            margin-bottom: 30px;
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff; margin: 0; padding: 0; font-size: 13px; }
            #content-to-print {
                padding: 0;
                border-radius: 0;
                box-shadow: none;
                border: none;
                margin: 0;
                overflow: visible;
            }
            .table-responsive { overflow-x: visible !important; }
            table { min-width: 100%; }
            .header-info { border-bottom: none; }
            th { background-color: #e2e8f0 !important; color: #000; -webkit-print-color-adjust: exact; }
            th, td { border: 1px solid #000; color: #000 !important; white-space: pre-wrap; }
            @page { size: A4 landscape; margin: 1cm; }
        }

        input[type="date"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-color: transparent;
        }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-inner-spin-button,
        input[type="date"]::-webkit-clear-button {
            display: none !important;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <button class="btn cloud-btn no-print" id="cloud-save-btn" onclick="saveAndPrint()">حفظ الشيت وطباعته 💾🖨️</button>

    <div id="content-to-print">
        <div class="hospital-logo">
            <img src="MEpics/Picture1.png" alt="مستشفى صيدناوي" onerror="this.onerror=null; this.src='TWEAKS/MEpics/Picture1.png';">
        </div>

        <h2>شيت مرور الأطباء</h2>

        <div class="header-info">
            <span>التاريخ: <input type="date" id="input-date"></span>
            <span>القسم: <input type="text" id="input-dept" placeholder="اكتب القسم"></span>
            <span>الطبيب: <input type="text" id="input-doc" placeholder="اسم الطبيب"></span>
        </div>

        <div id="loading-indicator" class="no-print"></div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th width="4%">م</th>
                        <th width="26%">اسم المريض</th>
                        <th width="11%">تاريخ الدخول</th>
                        <th width="8%">قسم الإقامة</th>
                        <th width="13%">التشخيص</th>
                        <th width="19%">الخطة العلاجية</th>
                        <th width="19%">الملاحظات</th>
                        <th width="4%" class="no-print"></th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>

    <button class="btn add-btn no-print" onclick="addRow()">+ إضافة مريض</button>
    <button class="btn clear-btn no-print" onclick="clearData()">مسح البيانات وبدء شيت جديد 🗑️</button>

    <script>
        const tbody = document.getElementById('table-body');
        const deptInput = document.getElementById('input-dept');
        const docInput = document.getElementById('input-doc');
        const dateInput = document.getElementById('input-date');
        const loadingIndicator = document.getElementById('loading-indicator');
        const originalTitle = document.title;

        const API_URL = "https://script.google.com/macros/s/AKfycbyK93D20fAUN3ZTUi03WA4xudNs17OyQLBnVF84RB0nLJDjCughOab5aWjms55XmrCNDw/exec";
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeEUxAcEspHRKlu7XJ6WIyN7__IMKqzSo1iMryvgH1T3upSkuXpkOTb9sSeDQhhuokPe4ZFem3P1mW/pub?gid=95330193&single=true&output=csv";

        let patientsData = [];

        function safeGetLocal(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function safeSetLocal(key, value) {
            try { localStorage.setItem(key, value); } catch (e) {}
        }
        function safeRemoveLocal(key) {
            try { localStorage.removeItem(key); } catch (e) {}
        }

        const today = new Date();
        const yyyy0 = today.getFullYear();
        const mm0 = String(today.getMonth() + 1).padStart(2, '0');
        const dd0 = String(today.getDate()).padStart(2, '0');
        dateInput.value = `${yyyy0}-${mm0}-${dd0}`;

        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        async function fetchPatientsCSV() {
            loadingIndicator.style.color = '#2563eb';
            loadingIndicator.innerText = 'جاري مزامنة أسماء المرضى من الشيت... ⏳';

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('فشل جلب الـ CSV');
                const csvText = await response.text();
                
                const lines = csvText.split(/\r\n|\n/).filter(l => l.trim() !== '');
                if (lines.length < 2) return;

                const headers = parseCSVLine(lines[0]).map(h => h.replace(/^"|"$/g, '').trim());
                
                let nameIdx = headers.findIndex(h => h.includes('اسم') || h.toLowerCase().includes('name'));
                let dateIdx = headers.findIndex(h => h.includes('تاريخ') || h.toLowerCase().includes('date') || h.toLowerCase().includes('admission'));

                if (nameIdx === -1) nameIdx = 1;
                if (dateIdx === -1) dateIdx = 2;

                patientsData = [];
                for (let i = 1; i < lines.length; i++) {
                    const cols = parseCSVLine(lines[i]).map(c => c.replace(/^"|"$/g, '').trim());
                    const name = cols[nameIdx] || '';
                    const date = cols[dateIdx] || '';
                    if (name) {
                        patientsData.push({ name: name, admissionDate: date });
                    }
                }

                loadingIndicator.style.color = '#16a34a';
                loadingIndicator.innerText = `✅ تم تحميل ${patientsData.length} مريض بنجاح`;
                setTimeout(() => { loadingIndicator.innerText = ''; }, 3000);

            } catch (e) {
                console.error(e);
                loadingIndicator.style.color = '#dc2626';
                loadingIndicator.innerText = '⚠️ تعذر سحب الأسماء تلقائياً';
            }
        }

        function parseDateToInputValue(rawDate) {
            if (!rawDate) return '';
            const str = String(rawDate).trim();
            let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            
            m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (m) {
                return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            }
            return '';
        }

        function renumberRows() {
            Array.from(tbody.rows).forEach((tr, idx) => {
                const numCell = tr.querySelector('.row-num');
                if (numCell) numCell.textContent = idx + 1;
            });
        }

        function addRow(rowData = {}) {
            const tr = document.createElement('tr');

            const tdNum = document.createElement('td');
            tdNum.className = 'row-num';
            tr.appendChild(tdNum);

            const tdName = document.createElement('td');
            const nameWrapper = document.createElement('div');
            nameWrapper.className = 'name-cell-wrapper';

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.className = 'table-input name-input';
            nameInput.placeholder = 'ابحث أو اكتب اسم المريض...';
            nameInput.autocomplete = 'off';
            nameInput.value = rowData.name || '';

            const suggestionsBox = document.createElement('div');
            suggestionsBox.className = 'suggestions-box';

            nameWrapper.appendChild(nameInput);
            nameWrapper.appendChild(suggestionsBox);
            tdName.appendChild(nameWrapper);
            tr.appendChild(tdName);

            const tdDate = document.createElement('td');
            const dateCell = document.createElement('input');
            dateCell.type = 'date';
            dateCell.className = 'table-input table-date-input';
            dateCell.value = rowData.date || '';
            tdDate.appendChild(dateCell);
            tr.appendChild(tdDate);

            const editableFields = ['residence', 'diag', 'plan', 'notes'];
            editableFields.forEach(field => {
                const td = document.createElement('td');
                td.setAttribute('contenteditable', 'true');
                td.textContent = rowData[field] || '';
                tr.appendChild(td);
            });

            const tdDel = document.createElement('td');
            tdDel.className = 'no-print';
            const delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'delete-row-btn';
            delBtn.textContent = '🗑️';
            delBtn.title = 'حذف هذا الصف';
            delBtn.addEventListener('click', function () {
                if (confirm('حذف هذا المريض من الشيت؟')) {
                    tr.remove();
                    renumberRows();
                    saveToLocalStorage();
                }
            });
            tdDel.appendChild(delBtn);
            tr.appendChild(tdDel);

            function applyPatientSelection(patient) {
                nameInput.value = patient.name;
                const parsedDate = parseDateToInputValue(patient.admissionDate);
                if (parsedDate) dateCell.value = parsedDate;
                closeSuggestions();
                saveToLocalStorage();
            }

            function closeSuggestions() {
                suggestionsBox.classList.remove('open');
                suggestionsBox.innerHTML = '';
            }

            function renderSuggestions(query) {
                suggestionsBox.innerHTML = '';
                const q = query.trim().toLowerCase();
                if (!q) { closeSuggestions(); return; }

                const matches = patientsData.filter(p => p.name.toLowerCase().includes(q)).slice(0, 10);
                if (matches.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'suggestion-empty';
                    empty.textContent = patientsData.length === 0 ? 'جاري التحميل...' : 'لا يوجد مريض بهذا الاسم';
                    suggestionsBox.appendChild(empty);
                    suggestionsBox.classList.add('open');
                    return;
                }

                matches.forEach(patient => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = patient.name;
                    item.appendChild(nameSpan);

                    if (patient.admissionDate) {
                        const dateSpan = document.createElement('span');
                        dateSpan.className = 'sugg-date';
                        dateSpan.textContent = 'تاريخ الدخول: ' + patient.admissionDate;
                        item.appendChild(dateSpan);
                    }

                    item.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        applyPatientSelection(patient);
                    });
                    item.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        applyPatientSelection(patient);
                    }, { passive: false });

                    suggestionsBox.appendChild(item);
                });
                suggestionsBox.classList.add('open');
            }

            nameInput.addEventListener('input', (e) => {
                renderSuggestions(e.target.value);
                saveToLocalStorage();
            });
            nameInput.addEventListener('focus', (e) => {
                if (e.target.value.trim()) renderSuggestions(e.target.value);
            });
            nameInput.addEventListener('blur', () => {
                setTimeout(closeSuggestions, 200);
            });

            dateCell.addEventListener('input', saveToLocalStorage);
            Array.from(tr.querySelectorAll('td[contenteditable="true"]')).forEach(td => {
                td.addEventListener('input', saveToLocalStorage);
            });

            tbody.appendChild(tr);
            renumberRows();
        }

        function saveToLocalStorage() {
            const data = {
                date: dateInput.value,
                dept: deptInput.value,
                doc: docInput.value,
                rows: []
            };

            Array.from(tbody.rows).forEach(tr => {
                data.rows.push({
                    name: tr.querySelector('.name-input').value.trim(),
                    date: tr.querySelector('.table-date-input').value,
                    residence: tr.cells[3].innerText.trim(),
                    diag: tr.cells[4].innerText.trim(),
                    plan: tr.cells[5].innerText.trim(),
                    notes: tr.cells[6].innerText.trim()
                });
            });

            safeSetLocal('sidnawi_round_data', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const savedData = safeGetLocal('sidnawi_round_data');
            if (savedData) {
                try {
                    const data = JSON.parse(savedData);
                    if (data.date) dateInput.value = data.date;
                    deptInput.value = data.dept || '';
                    docInput.value = data.doc || '';

                    if (data.rows && data.rows.length > 0) {
                        data.rows.forEach(rowData => addRow(rowData));
                        return;
                    }
                } catch (e) {}
            }

            for (let i = 1; i <= 5; i++) {
                addRow();
            }
        }

        async function saveToCloud() {
            const rows = Array.from(tbody.rows).map(tr => ({
                name: tr.querySelector('.name-input').value.trim(),
                admissionDate: tr.querySelector('.table-date-input').value,
                residence: tr.cells[3].innerText.trim(),
                diag: tr.cells[4].innerText.trim(),
                plan: tr.cells[5].innerText.trim(),
                notes: tr.cells[6].innerText.trim()
            })).filter(row => row.name !== '');

            if (rows.length === 0) {
                alert('لا يوجد بيانات مرضى لحفظها.');
                return false;
            }

            const currentHour = new Date().getHours();
            const shiftType = currentHour >= 14 ? 'مسائي' : 'صباحي';

            const payload = {
                date: dateInput.value,
                shift: shiftType,
                dept: deptInput.value.trim() || 'عام',
                doc: docInput.value.trim() || 'غير مسجل',
                rows: rows
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                return result.status === 'success';
            } catch (error) {
                alert('⚠️ تم فتح الطباعة، ولكن تعذر الحفظ السحابي الحالي.');
                return false;
            }
        }

        async function saveAndPrint() {
            const deptVal = deptInput.value.trim();
            const docVal = docInput.value.trim();

            if (!deptVal || !docVal) {
                alert('⚠️ تنبيه هام:\nمن فضلك اكتب "اسم القسم" و "اسم الطبيب" في الأعلى قبل الحفظ والطباعة.');
                if (!deptVal) deptInput.focus();
                else docInput.focus();
                return;
            }

            const btn = document.getElementById('cloud-save-btn');
            const originalText = btn.textContent;

            btn.disabled = true;
            btn.textContent = 'جاري الحفظ... ⏳';

            await saveToCloud();

            btn.textContent = 'جاري فتح الطباعة...';
            customPrint();

            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
            }, 1500);
        }

        function clearData() {
            if (confirm('هل أنت متأكد من مسح جميع بيانات الشيت الحالي وبدء شيت جديد؟')) {
                safeRemoveLocal('sidnawi_round_data');
                location.reload();
            }
        }

        dateInput.addEventListener('input', saveToLocalStorage);
        deptInput.addEventListener('input', saveToLocalStorage);
        docInput.addEventListener('input', saveToLocalStorage);

        fetchPatientsCSV();
        loadFromLocalStorage();

        function customPrint() {
            const deptName = deptInput.value.trim() ? deptInput.value.trim() : "عام";
            const currentHour = new Date().getHours();
            const shiftType = currentHour >= 14 ? "مسائي" : "صباحي";

            document.title = `شيت_مرور_${deptName}_${shiftType}_${dateInput.value}`;

            function restoreTitle() {
                document.title = originalTitle;
                window.removeEventListener('afterprint', restoreTitle);
            }
            window.addEventListener('afterprint', restoreTitle);

            window.print();
        }
    </script>
</body>
</html>
